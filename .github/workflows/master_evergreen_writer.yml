name: Master V3 Evergreen Publisher (Live)

on:
  schedule:
    # Evergreen generation budget: 120 minutes plus 15 minutes spare.
    # Inside that lead, preparation now runs to its own 30-minute clock (see
    # time_budget.py): a stalled download or a hung model call fails the slot fast and
    # the ten-minute recovery cycle starts a fresh attempt, so no single run can sit on
    # a slot for hours. Nothing here cancels a healthy run by age - the run stops itself.
    - cron: '30 0 * * *'   # Prepare 06:00 IST → live 08:15
    - cron: '30 3 * * *'   # Prepare 09:00 IST → live 11:15
    - cron: '30 7 * * *'   # Prepare 13:00 IST → live 15:15
    - cron: '0 12 * * *'   # Prepare 17:30 IST → live 19:45
    - cron: '30 14 * * *'  # Prepare 20:00 IST → live 22:15
  workflow_dispatch:
    inputs:
      slot:
        description: "Evergreen rotation slot, 0 through 4"
        required: true
        type: choice
        options: ['0','1','2','3','4']
      publish:
        description: "Publish after preparation; scheduled runs publish automatically"
        required: true
        type: boolean
        default: false
      retry_attempt:
        description: "Internal bounded recovery attempt"
        required: false
        type: string
        default: '0'

permissions:
  contents: write
  models: read
  actions: write

concurrency:
  # Suppress duplicate attempts for the same article without letting a future
  # embargo wait block recovery of a different overdue Master slot.
  group: daily-yield-master-v3-evergreen-${{ inputs.slot || (github.event.schedule == '30 0 * * *' && '0') || (github.event.schedule == '30 3 * * *' && '1') || (github.event.schedule == '30 7 * * *' && '2') || (github.event.schedule == '0 12 * * *' && '3') || (github.event.schedule == '30 14 * * *' && '4') || github.run_id }}
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests Pillow ImageHash json-repair google-api-python-client google-auth
      - name: Start quota-independent local text model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for attempt in {1..30}; do curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 2; done
          ollama pull qwen2.5:1.5b
      - name: Select evergreen rotation slot
        id: slot
        run: |
          case "${{ github.event.schedule }}" in
            '30 0 * * *') value=0 ;;
            '30 3 * * *') value=1 ;;
            '30 7 * * *') value=2 ;;
            '0 12 * * *') value=3 ;;
            '30 14 * * *') value=4 ;;
            *) value="${{ inputs.slot }}" ;;
          esac
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - name: Research, write, validate and select three photos
        id: prepare
        env:
          MASTER_PREPARATION_BUDGET_MINUTES: '30'
          OLLAMA_API_URL: http://127.0.0.1:11434
          OLLAMA_MODEL: qwen2.5:1.5b
          GITHUB_TOKEN: ${{ github.token }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          GSC_SITE_PROPERTY: ${{ secrets.GSC_SITE_PROPERTY }}
          MASTER_BACKFILL: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: |
          started=$SECONDS
          for attempt in 1 2; do
            if python master_v3_pipeline.py --kind evergreen --slot "${{ steps.slot.outputs.value }}" --prepare; then
              echo "Preparation took $((SECONDS-started)) seconds of the 1800-second budget."; exit 0
            fi
            spent=$((SECONDS-started))
            echo "Preparation attempt $attempt failed after $spent seconds."
            # A second attempt is worth its while only when the first one fell over quickly - a
            # model that refused to start, a git race. Grinding for twenty minutes and then
            # repeating it would double the run and still finish nothing, so the day's ten-minute
            # recovery cycle is asked to start a fresh attempt instead.
            if [ "$attempt" = "2" ] || [ "$spent" -gt 600 ]; then
              if [ "$spent" -gt 600 ]; then echo "Not retrying in this run: $spent of the 1800-second budget is already used; recovery will dispatch a fresh attempt."; fi
              exit 1
            fi
            echo "Rolling back partial package state before the final retry."
            git reset --hard HEAD
            git clean -fd master_packages/dynamic assets/master scheduled_ready
            sleep 20
          done
          exit 1
      # Failure detail stays in the run summary, the run annotation and retained
      # artifacts. It is never committed to main.
      - name: Show failure reason in the run summary
        if: failure()
        run: |
          reason=$(python -c "import json;d=json.load(open('MASTER_AUTOMATION_STATUS.json'));print(d.get('error','no persisted reason'))" 2>/dev/null || echo 'no persisted reason')
          echo "::error title=Master generation blocked::$reason"
          {
            echo '### Master generation did not publish';
            echo '```json';
            cat MASTER_AUTOMATION_STATUS.json 2>/dev/null || echo '{}';
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"
      # Only the one-line reason is committed, never a half-written package: the run publishes nothing
      # on this path, so the file it records is evidence for the morning check and nothing else.
      - name: Leave the failure reason where the morning check reads it
        if: failure()
        run: |
          set -uo pipefail
          git config user.name "Daily Yield Master Writer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python master_failure_brief.py --workflow master_evergreen_writer.yml --kind evergreen --slot "${{ steps.slot.outputs.value }}" --run "${{ github.run_id }}" || true
          # -f because this file is only ever written by a failing run: untracked, and a plain
          # `git add` of a path a .gitignore rule happens to cover reported nothing and the reason
          # was lost with the runner - which is why 21 October's fifteen failures left no record.
          git add -f MASTER_FAILURE_BRIEF.json
          if git diff --cached --quiet; then exit 0; fi
          for attempt in 1 2 3; do
            git commit -q -m "Master evergreen writer left its failure reason [skip ci]" || exit 0
            if git pull --rebase -q --autostash origin main && git push -q origin HEAD:main; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 0
      - name: Persist validated package and licensed photo assets first
        run: |
          set -euo pipefail
          exec > >(tee /tmp/master-persistence.log) 2>&1
          git config user.name "Daily Yield Master Writer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/master-preparation
          cp PHOTO_USAGE_REGISTRY.json MASTER_AUTOMATION_STATUS.json MASTER_DAILY_PLAN.json /tmp/master-preparation/
          git add master_packages/dynamic assets/master PHOTO_USAGE_REGISTRY.json photo_library MASTER_AUTOMATION_STATUS.json MASTER_DAILY_PLAN.json scheduled_ready
            git add -A PHOTO_LIBRARY_STATUS.json 2>/dev/null || true
          git diff --cached --name-only | grep -Ev '^(PHOTO_USAGE_REGISTRY|MASTER_AUTOMATION_STATUS|MASTER_DAILY_PLAN)\.json$' > /tmp/master-preparation/files.txt || true
          if [ -s /tmp/master-preparation/files.txt ]; then tar -cf /tmp/master-preparation/files.tar -T /tmp/master-preparation/files.txt; fi
          git reset --hard HEAD
          for attempt in 1 2 3 4 5; do
            git fetch origin main && git reset --hard FETCH_HEAD
            if [ -f /tmp/master-preparation/files.tar ]; then tar -xf /tmp/master-preparation/files.tar; fi
            python merge_master_preparation.py MASTER_DAILY_PLAN.json /tmp/master-preparation/MASTER_DAILY_PLAN.json /tmp/master-preparation/MASTER_AUTOMATION_STATUS.json PHOTO_USAGE_REGISTRY.json /tmp/master-preparation/PHOTO_USAGE_REGISTRY.json /tmp/master-preparation/merged
            mv /tmp/master-preparation/merged.plan.json MASTER_DAILY_PLAN.json
            mv /tmp/master-preparation/merged.registry.json PHOTO_USAGE_REGISTRY.json
            cp /tmp/master-preparation/MASTER_AUTOMATION_STATUS.json .
            git add master_packages/dynamic assets/master PHOTO_USAGE_REGISTRY.json photo_library MASTER_AUTOMATION_STATUS.json MASTER_DAILY_PLAN.json scheduled_ready
            git add -A PHOTO_LIBRARY_STATUS.json 2>/dev/null || true
            if git diff --staged --quiet; then exit 0; fi
            git commit -m "Prepare dynamic evergreen Master package [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
      - name: Publish after successful validated preparation
        if: ${{ github.event_name == 'schedule' || inputs.publish }}
        env:
          MASTER_PUBLICATION_ENABLED: 'true'
          MASTER_BACKFILL: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          # A blocked topic is substituted at publication time, and the substitute is
          # written here, not in the prepare step. Search Console demand inputs were
          # only given to the prepare step, so the rescue died with "GSC_CLIENT_ID is
          # required" while the topic it needed was sitting unused in the pool. Any
          # step that can build an article carries the same inputs as the prepare step.
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          GSC_SITE_PROPERTY: ${{ secrets.GSC_SITE_PROPERTY }}
        run: python master_v3_pipeline.py --kind evergreen --slot "${{ steps.slot.outputs.value }}" --publish ${{ github.event_name == 'schedule' && '--timed-release' || '' }}
      - name: Tell the search engines the new article is live
        if: success()
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          INDEXNOW_KEY_LOCATION: ${{ secrets.INDEXNOW_KEY_LOCATION }}
        run: |
          set -uo pipefail
          python - <<'PY'
          import json, pathlib, subprocess, datetime
          ist = datetime.timezone(datetime.timedelta(hours=5, minutes=30))
          today = datetime.datetime.now(ist).date().isoformat()
          rows = json.loads(pathlib.Path("MASTER_AUTOMATION_TRACKER.json").read_text(encoding="utf-8")).get("published", [])
          urls = [r.get("url", "") for r in rows if r.get("date") == today and r.get("url")]
          if urls:
              subprocess.run(["python", "indexnow_submit.py", "--apply",
                              *sum([["--url", u] for u in urls], [])], check=False)
          PY
      - name: Persist confirmed publication before downstream routing
        if: ${{ (github.event_name == 'schedule' || inputs.publish) && success() }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/master-state
          cp MASTER_AUTOMATION_TRACKER.json MASTER_AUTOMATION_STATUS.json MASTER_TOPIC_HISTORY.json /tmp/master-state/
          git config user.name "Daily Yield Master Writer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main && git reset --hard FETCH_HEAD
            python merge_master_state.py MASTER_AUTOMATION_TRACKER.json /tmp/master-state/MASTER_AUTOMATION_TRACKER.json MASTER_AUTOMATION_TRACKER.merged.json published
            mv MASTER_AUTOMATION_TRACKER.merged.json MASTER_AUTOMATION_TRACKER.json
            python merge_master_state.py MASTER_TOPIC_HISTORY.json /tmp/master-state/MASTER_TOPIC_HISTORY.json MASTER_TOPIC_HISTORY.merged.json items
            mv MASTER_TOPIC_HISTORY.merged.json MASTER_TOPIC_HISTORY.json
            cp /tmp/master-state/MASTER_AUTOMATION_STATUS.json .
            git add MASTER_AUTOMATION_TRACKER.json MASTER_AUTOMATION_STATUS.json MASTER_TOPIC_HISTORY.json photo_library
            git add -A PHOTO_LIBRARY_STATUS.json 2>/dev/null || true
            if git diff --staged --quiet; then exit 0; fi
            git commit -m "Record evergreen Master publication [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
      - name: Route confirmed publication to two social networks
        if: ${{ (github.event_name == 'schedule' || inputs.publish) && success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python dispatch_social_events.py
      - name: Trigger page refresh and Bing reconciliation
        if: ${{ (github.event_name == 'schedule' || inputs.publish) && success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in content_experience_repair.yml bing_url_automation.yml; do
            completed=false
            for attempt in 1 2 3; do
              if gh workflow run "$workflow" --ref main; then completed=true; break; fi
              sleep $((attempt * 3))
            done
            $completed || exit 1
          done
      # A late failure (publish, tracker or routing) must also be explainable
      # without committing anything to main.
      - name: Show late failure reason in the run annotation
        if: failure()
        run: |
          reason=$(python -c "import json;d=json.load(open('MASTER_AUTOMATION_STATUS.json'));print(d.get('status','?'),d.get('stage','?'),d.get('error','no persisted reason'))" 2>/dev/null || echo 'no persisted reason')
          echo "::error title=Master run blocked::$reason"
          cat MASTER_AUTOMATION_STATUS.json 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
      - name: Preserve Master pipeline diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-evergreen-diagnostics-${{ github.run_id }}
          path: |
            MASTER_AUTOMATION_STATUS.json
            MASTER_PREPARATION_REPORT.json
            /tmp/master-persistence.log
          if-no-files-found: warn
          retention-days: 30
