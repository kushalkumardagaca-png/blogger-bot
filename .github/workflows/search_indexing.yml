name: Search Engine Indexing

# The one job the publish workflows cannot do themselves: catch up on URLs that
# were never announced, and keep the record of what each channel accepted.
# Bing URL submission is owned by "Bing URL Automation" (every two hours, inside
# its 100-a-day quota) so the two systems never compete for the same allowance.
on:
  schedule:
    - cron: '45 20 * * *'   # 02:15 IST daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'indexnow_submit.py'
      - '.github/workflows/search_indexing.yml'

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Announce new URLs where the host allows it
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          INDEXNOW_KEY_LOCATION: ${{ secrets.INDEXNOW_KEY_LOCATION }}
        run: |
          # Announce the ranked list, not the whole sitemap. The index was 1 of 551 URLs when
          # this changed, and the queue held duplicate-title and utility pages alongside the
          # articles; announcing everything spends the crawl budget nothing is indexed with.
          if [ -f INDEX_PRIORITY.json ]; then
            python3 -c "import json;print('\n'.join(json.load(open('INDEX_PRIORITY.json'))['announce']))" > /tmp/dy-announce.txt
            if [ -s /tmp/dy-announce.txt ]; then
              echo "announcing the priority list ($(wc -l < /tmp/dy-announce.txt) URLs) instead of the whole sitemap"
              python indexnow_submit.py --apply --urls-file /tmp/dy-announce.txt \
                || echo "::warning title=IndexNow refused the batch::the Bing URL API stays as the safety net"
            else
              echo "priority list is empty; falling back to the sitemap"
              python indexnow_submit.py --apply --from-sitemap || echo "IndexNow reported an error"
            fi
          else
            python indexnow_submit.py --apply --from-sitemap || echo "IndexNow reported an error"
          fi
      - name: Say what the announcement queue actually did
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib
          path = pathlib.Path("INDEXNOW_STATE.json")
          state = json.loads(path.read_text()) if path.exists() else {}
          accepted = len(state.get("submitted") or {})
          pending = len(state.get("pending") or [])
          print(f"indexnow: {accepted} URLs accepted so far, {pending} still queued")
          if accepted == 0 and pending:
              print("::warning title=IndexNow never submits::URLs are queued but nothing has ever been "
                    "accepted; set or repair the INDEXNOW_KEY repository secret")
          PY
      - name: Persist the indexing record
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Daily Yield Arena Controller"
          git config user.email "dailyyield.official@gmail.com"
          mkdir -p /tmp/dy-index
          for f in INDEXNOW_STATE.json; do
            if [ -f "$f" ]; then cp "$f" /tmp/dy-index/; else echo "::warning title=Missing evidence::$f was not written"; fi
          done
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/dy-index/* . 2>/dev/null || true
            git add INDEXNOW_STATE.json 2>/dev/null || true
            if git diff --staged --quiet; then exit 0; fi
            git commit -m "Record search indexing state [skip ci]" || true
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
