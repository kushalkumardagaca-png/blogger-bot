name: One-Time Rotating Page Social Launch
on:
  push:
    paths:
      - '.github/workflows/page_social_launch.yml'
permissions:
  contents: write
concurrency:
  group: one-time-rotating-page-social-launch
  cancel-in-progress: false
jobs:
  verify-live-format:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pillow
      - name: Publish today's scheduled Daily News page promotion on Bluesky
        env:
          BLUESKY_HANDLE: 'dailyyield.bsky.social'
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python bluesky_publisher.py --content-mode page --target-url 'https://dailyyield.blogspot.com/p/daily-news.html'
      - name: Persist verified Bluesky state
        run: |
          git config user.name 'Daily Yield Bluesky Bot'
          git config user.email 'bot@dailyyield.blogspot.com'
          bash persist_social_state.sh bluesky_tracker.json
