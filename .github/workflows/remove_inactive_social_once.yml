name: Remove inactive social channels once

on:
  push:
    branches: [main]
    paths:
      - 'remove_inactive_social.py'
      - '.github/workflows/remove_inactive_social_once.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: daily-yield-security-guard
  cancel-in-progress: false

jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check requests
      - name: Remove inactive social links and disclosures through Blogger API
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python remove_inactive_social.py
      - name: Approve intentional authenticated cleanup
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python security_guard.py --approve-current
      - name: Verify zero-view and full-site invariants
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
        run: python zero_view_watchdog.py
      - name: Upload recovery backup and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inactive-social-removal-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: ignore
          path: |
            INACTIVE_SOCIAL_REMOVAL_BACKUP.json.gz
            INACTIVE_SOCIAL_REMOVAL_REPORT.json
            SECURITY_STATUS.json
            SECURITY_STATUS.md
            ZERO_VIEW_WATCHDOG.json
            ZERO_VIEW_WATCHDOG.md
      - name: Persist cleanup report with race-safe retries
        if: always()
        run: |
          test -f INACTIVE_SOCIAL_REMOVAL_REPORT.json || exit 1
          cp INACTIVE_SOCIAL_REMOVAL_REPORT.json /tmp/inactive-social-report.json
          git config user.name 'Daily Yield Inactive Social Cleanup'
          git config user.email 'bot@dailyyield.blogspot.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/inactive-social-report.json INACTIVE_SOCIAL_REMOVAL_REPORT.json
            git add INACTIVE_SOCIAL_REMOVAL_REPORT.json
            if git diff --staged --quiet; then exit 0; fi
            git commit -m 'Remove inactive social channels from Blogger [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
