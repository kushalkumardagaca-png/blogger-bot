name: Solve Remaining Naming Items

# Runs the one-off solver that finishes everything reachable through the Blogger
# API: the blog's stored description, a fresh test of the page search-description
# field, and the optional privacy-page vendor sentence. Whatever it cannot reach is
# listed, in plain words, for the Blogger screen.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'solve_remaining.py'
      - '.github/workflows/solve_remaining.yml'

permissions:
  contents: write

jobs:
  solve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install --quiet requests
      - name: Run the remaining-item solver
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python solve_remaining.py
      - name: Persist the solver report
        if: always()
        run: |
          set -euo pipefail
          git config user.name "Daily Yield Arena Controller"
          git config user.email "dailyyield.official@gmail.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            cp /tmp/keep.json /dev/null 2>/dev/null || true
            git add REMAINING_SOLVER_REPORT.json 2>/dev/null || true
            if git diff --cached --quiet; then break; fi
            git commit -m "Record the remaining naming items the API could and could not reach [skip ci]" || true
            if git push origin main; then break; fi
            sleep 8
          done
