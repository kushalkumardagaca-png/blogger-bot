name: One-Time Master Live Activation

on:
  push:
    branches: [main]
    paths: ['.github/workflows/master_live_activation.yml']

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-yield-master-writer
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests Pillow ImageHash google-api-python-client google-auth pytest
      - name: Audit active system before first publication
        run: |
          pytest -q test_master_dynamic_system.py test_daily_article_experience.py test_auto_blogger_publisher.py
          python audit_publishing_automation.py
      - name: Publish the completely prepared evergreen validation article
        env:
          MASTER_PUBLICATION_ENABLED: 'true'
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python master_dynamic_pipeline.py --kind evergreen --slot 0 --publish
      - name: Route and persist evergreen publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python dispatch_social_events.py
          git config user.name "Daily Yield Master Activation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MASTER_AUTOMATION_TRACKER.json MASTER_AUTOMATION_STATUS.json MASTER_TOPIC_HISTORY.json social_events.json
          git commit -m "Activate first evergreen Master publication [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Prepare first trending Master article and three photographs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          GSC_SITE_PROPERTY: ${{ secrets.GSC_SITE_PROPERTY }}
        run: python master_dynamic_pipeline.py --kind trending --slot 0 --prepare
      - name: Commit trending assets before publication
        run: |
          git add master_packages/dynamic assets/master PHOTO_USAGE_REGISTRY.json MASTER_AUTOMATION_STATUS.json scheduled_ready
          git commit -m "Prepare first live trending Master package [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Publish first trending Master article
        env:
          MASTER_PUBLICATION_ENABLED: 'true'
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python master_dynamic_pipeline.py --kind trending --slot 0 --publish
      - name: Route, persist and refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python dispatch_social_events.py
          git add MASTER_AUTOMATION_TRACKER.json MASTER_AUTOMATION_STATUS.json MASTER_TOPIC_HISTORY.json social_events.json
          git commit -m "Activate first trending Master publication [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run content_experience_repair.yml --ref main
          gh workflow run bing_url_automation.yml --ref main
