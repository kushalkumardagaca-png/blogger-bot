name: Master Generation Stale-Run Reaper

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/master_stale_run_reaper.yml'

permissions:
  actions: write
  contents: read

jobs:
  reap:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Cancel only genuinely stalled local-model Master generators
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Owner-directed retirement: do not finish or publish any 12/13 October
          # Master attempt. Runs begun before this epoch belong to that abandoned
          # backlog. Runs for 14 October and later are never cancelled for age.
          repair_epoch=$(date -u -d '2026-10-13T16:35:00Z' +%s)
          gh run list --repo "$GH_REPO" --status in_progress --limit 100 \
            --json databaseId,workflowName,startedAt | jq -r '.[] | select(.workflowName=="Master Trending Writer (Live)" or .workflowName=="Master Evergreen Writer (Live)" or .workflowName=="Master V3 Trending Publisher (Live)" or .workflowName=="Master V3 Evergreen Publisher (Live)") | [.databaseId,.startedAt] | @tsv' |
          while IFS=$'\t' read -r run_id started_at; do
            [ -n "$run_id" ] || continue
            started=$(date -u -d "$started_at" +%s)
            # Cancel only superseded pre-repair runs. Current generation is
            # never cancelled for age; permanent recovery restarts an article if
            # the hosting platform itself eventually terminates a runner.
            if [ "$started" -lt "$repair_epoch" ]; then
              echo "Cancelling superseded pre-repair Master run $run_id"
              gh run cancel "$run_id" --repo "$GH_REPO" || true
            fi
          done
