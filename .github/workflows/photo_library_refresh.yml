name: Photo Library Refresh

# Builds the prepared photo pools so no publication run ever waits for a picture:
#   * 40-50 licence-verified photographs per News desk, used in strict rotation;
#   * 10 licensed candidates for every evergreen and trending article.
# Only clearly licensed sources are used (Wikimedia Commons and Openverse), with
# creator, licence and source page recorded for each photograph.

on:
  schedule:
    # 01:15 IST. This used to run at 00:15 IST, five minutes BEFORE Master Topic Discovery wrote the
    # day's ten-topic plan at 00:20 IST, so the master pools were always built from yesterday's plan and
    # the articles that actually ran today arrived with an empty pool (several with `entries: 0`) and had
    # to hunt Commons inside their own half-hour preparation window. Still before the 04:15 IST news desk.
    - cron: '45 19 * * *'
  workflow_dispatch:
    inputs:
      scope:
        description: 'news, master, or both'
        required: false
        default: both
        type: choice
        options: [both, news, master]
  push:
    branches: [main]
    paths:
      - 'photo_library.py'
      - 'photo_library_build.py'
      - 'test_photo_library.py'
      - '.github/photo-library-refresh-request'
      - '.github/workflows/photo_library_refresh.yml'

permissions:
  contents: write

concurrency:
  group: daily-yield-photo-library
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check requests
      - name: Validate the pool rules
        run: python -m unittest test_photo_library -v
      - name: Build or top up the pools
        env:
          PHOTO_SCOPE: ${{ inputs.scope }}
        run: |
          set -uo pipefail
          scope="$PHOTO_SCOPE"
          if [ -z "$scope" ]; then scope=both; fi
          if ! timeout 6300 python -u photo_library_build.py --scope "$scope" --minutes 100 > /tmp/pool.log 2>&1; then
            echo "::error title=Photo pool build failed::$(tail -c 800 /tmp/pool.log | tr '\n' '|')"
            cat /tmp/pool.log
            exit 1
          fi
          cat /tmp/pool.log
      - name: Keep the pool evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photo-library-${{ github.run_id }}
          retention-days: 90
          path: |
            PHOTO_LIBRARY_STATUS.json
            photo_library/
      - name: Persist the pools
        run: |
          set -euo pipefail
          git config user.name 'Daily Yield Photo Desk'
          git config user.email 'dailyyield.official@gmail.com'
          mkdir -p /tmp/dy-photos
          cp -r photo_library /tmp/dy-photos/
          cp PHOTO_LIBRARY_STATUS.json /tmp/dy-photos/
          for attempt in 1 2 3; do
            git fetch origin main && git reset --hard FETCH_HEAD
            mkdir -p photo_library
            cp -r /tmp/dy-photos/photo_library/. photo_library/
            cp /tmp/dy-photos/PHOTO_LIBRARY_STATUS.json .
            git add photo_library PHOTO_LIBRARY_STATUS.json
            if git diff --staged --quiet; then exit 0; fi
            git commit -m 'Refresh prepared photo pools [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
