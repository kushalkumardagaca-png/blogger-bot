name: One-Time Master Social Recovery

on:
  push:
    branches: [main]
    paths: ['.github/workflows/master_social_recovery.yml', 'social_rotation.py']

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Route the two authenticated activation publications
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run coordinated_social_publish.yml --ref main -f item_key=master-evergreen-0 -f target_url=https://dailyyield.blogspot.com/2026/10/mastering-budgeting-for-beginners.html -f content_mode=post -f published_at=2026-10-10T03:07:09-07:00
          gh workflow run coordinated_social_publish.yml --ref main -f item_key=master-trending-0 -f target_url=https://dailyyield.blogspot.com/2026/10/national-budget-realities-fiscal-policy.html -f content_mode=post -f published_at=2026-10-10T03:28:56-07:00
