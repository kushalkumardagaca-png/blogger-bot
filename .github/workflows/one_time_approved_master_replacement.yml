name: One-Time Approved Master Replacement
# Ephemeral, generation-free workflow for this corrected Arena-authored and validated package.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one_time_approved_master_replacement.yml'

concurrency:
  group: daily-yield-master-publisher
  cancel-in-progress: false

jobs:
  apply_prepared_master:
    if: contains(github.event.head_commit.message, '[run master rewrite]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow imagehash requests

      - name: Back up the exact prepared Post before any update
        run: python rewrite_existing_masters.py backup-next

      - name: Persist the authenticated original backup
        run: |
          set -euo pipefail
          git config user.name "Daily Yield Master Migration"
          git config user.email "bot@dailyyield.blogspot.com"
          git add MASTER_REWRITE_STATE.json MASTER_REWRITE_REPORT.json master_rewrite_backups
          git commit -m "Back up approved Master before in-place rewrite [skip ci]"
          for attempt in {1..12}; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Validate the committed Arena-authored package without generation
        run: python rewrite_existing_masters.py prepare-pending

      - name: Apply to the preserved Blogger Post ID and authenticate reread
        id: application
        continue-on-error: true
        run: python rewrite_existing_masters.py apply-pending

      - name: Persist verified rewrite state or redacted failure
        if: always()
        run: |
          set -euo pipefail
          git add MASTER_REWRITE_STATE.json MASTER_REWRITE_REPORT.json
          if ! git diff --staged --quiet; then
            git commit -m "Record approved Master replacement result [skip ci]"
            for attempt in {1..12}; do
              git pull --rebase origin main
              if git push origin HEAD:main; then pushed=true; break; fi
              sleep $((attempt * 2))
            done
            test "${pushed:-false}" = true
          fi

      - name: Enforce fail-closed result
        if: steps.application.outcome == 'failure'
        run: exit 1

      - name: Upload redacted migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: approved-master-replacement-${{ github.run_id }}
          retention-days: 30
          path: |
            MASTER_REWRITE_STATE.json
            MASTER_REWRITE_REPORT.json
            master_packages/rewrites/post_7123852462020825588.json
