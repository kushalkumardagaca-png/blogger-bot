name: Master V3 Trending Publisher (Live)

on:
  schedule:
    # Trending generation budget: 150 minutes plus 15 minutes spare.
    - cron: '0 22 * * *'   # Prepare 03:30 IST → live 06:15
    - cron: '0 1 * * *'    # Prepare 06:30 IST → live 09:15
    - cron: '0 6 * * *'    # Prepare 11:30 IST → live 14:15
    - cron: '0 8 * * *'    # Prepare 13:30 IST → live 16:15
    - cron: '30 12 * * *'  # Prepare 18:00 IST → live 20:45
  workflow_dispatch:
    inputs:
      slot:
        description: "Trending category slot, 0 through 4"
        required: true
        type: choice
        options: ['0','1','2','3','4']
      publish:
        description: "Publish after preparation; scheduled runs publish automatically"
        required: true
        type: boolean
        default: false
      retry_attempt:
        description: "Internal bounded recovery attempt"
        required: false
        type: string
        default: '0'

permissions:
  contents: write
  models: read
  actions: write

concurrency:
  # Shared photo and package state has one writer. Oldest-first recovery ensures
  # this lane carries the earliest missing article before later slots.
  group: daily-yield-master-v3-state-writer
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests Pillow ImageHash json-repair google-api-python-client google-auth
      - name: Start quota-independent local text model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for attempt in {1..30}; do curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 2; done
          ollama pull qwen2.5:1.5b
      - name: Select trending category slot
        id: slot
        run: |
          case "${{ github.event.schedule }}" in
            '0 22 * * *') value=0 ;;
            '0 1 * * *') value=1 ;;
            '0 6 * * *') value=2 ;;
            '0 8 * * *') value=3 ;;
            '30 12 * * *') value=4 ;;
            *) value="${{ inputs.slot }}" ;;
          esac
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - name: Research, write, validate and select three photos
        id: prepare
        env:
          OLLAMA_API_URL: http://127.0.0.1:11434
          OLLAMA_MODEL: qwen2.5:1.5b
          GITHUB_TOKEN: ${{ github.token }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          GSC_SITE_PROPERTY: ${{ secrets.GSC_SITE_PROPERTY }}
          MASTER_BACKFILL: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: |
          for attempt in 1 2; do
            if python master_v3_pipeline.py --kind trending --slot "${{ steps.slot.outputs.value }}" --prepare; then
              exit 0
            fi
            echo "Preparation attempt $attempt failed."
            if [ "$attempt" -eq 2 ]; then exit 1; fi
            echo "Rolling back partial package state before the final retry."
            git reset --hard HEAD
            git clean -fd master_packages/dynamic assets/master scheduled_ready
            sleep $((attempt * 20))
          done
          exit 1
      - name: Persist failed preparation diagnosis
        if: failure()
        run: |
          set -euo pipefail
          cp MASTER_AUTOMATION_STATUS.json /tmp/master-failure.json
          git config user.name "Daily Yield Master Writer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main && git reset --hard FETCH_HEAD
            mkdir -p master_failures
            cp /tmp/master-failure.json "master_failures/${{ github.run_id }}-trending-${{ steps.slot.outputs.value }}.json"
            git add master_failures
            git commit -m "Record trending generation failure [skip ci]" || exit 0
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
      - name: Requeue one bounded recovery after a failed generation
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="${{ inputs.retry_attempt || '0' }}"
          if [ "$current" -lt 2 ]; then
            next=$((current+1))
            gh workflow run master_trending_writer.yml --ref main -f slot="${{ steps.slot.outputs.value }}" -f publish="${{ github.event_name == 'schedule' && 'true' || inputs.publish }}" -f retry_attempt="$next"
            echo "Queued bounded retry $next for trending slot ${{ steps.slot.outputs.value }}"
          fi
      - name: Persist validated package and licensed photo assets first
        run: |
          set -euo pipefail
          git config user.name "Daily Yield Master Writer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/master-preparation
          cp PHOTO_USAGE_REGISTRY.json MASTER_AUTOMATION_STATUS.json MASTER_DAILY_PLAN.json /tmp/master-preparation/
          git add master_packages/dynamic assets/master PHOTO_USAGE_REGISTRY.json MASTER_AUTOMATION_STATUS.json MASTER_DAILY_PLAN.json scheduled_ready
          git diff --cached --name-only | grep -Ev '^(PHOTO_USAGE_REGISTRY|MASTER_AUTOMATION_STATUS|MASTER_DAILY_PLAN)\.json$' > /tmp/master-preparation/files.txt || true
          if [ -s /tmp/master-preparation/files.txt ]; then tar -cf /tmp/master-preparation/files.tar -T /tmp/master-preparation/files.txt; fi
          git reset --hard HEAD
          for attempt in 1 2 3 4 5; do
            git fetch origin main && git reset --hard FETCH_HEAD
            if [ -f /tmp/master-preparation/files.tar ]; then tar -xf /tmp/master-preparation/files.tar; fi
            python merge_master_preparation.py MASTER_DAILY_PLAN.json /tmp/master-preparation/MASTER_DAILY_PLAN.json /tmp/master-preparation/MASTER_AUTOMATION_STATUS.json PHOTO_USAGE_REGISTRY.json /tmp/master-preparation/PHOTO_USAGE_REGISTRY.json /tmp/master-preparation/merged
            mv /tmp/master-preparation/merged.plan.json MASTER_DAILY_PLAN.json
            mv /tmp/master-preparation/merged.registry.json PHOTO_USAGE_REGISTRY.json
            cp /tmp/master-preparation/MASTER_AUTOMATION_STATUS.json .
            git add master_packages/dynamic assets/master PHOTO_USAGE_REGISTRY.json MASTER_AUTOMATION_STATUS.json MASTER_DAILY_PLAN.json scheduled_ready
            if git diff --staged --quiet; then exit 0; fi
            git commit -m "Prepare dynamic trending Master package [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
      - name: Publish after successful validated preparation
        if: ${{ github.event_name == 'schedule' || inputs.publish }}
        env:
          MASTER_PUBLICATION_ENABLED: 'true'
          MASTER_BACKFILL: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python master_v3_pipeline.py --kind trending --slot "${{ steps.slot.outputs.value }}" --publish ${{ github.event_name == 'schedule' && '--timed-release' || '' }}
      - name: Persist confirmed publication before downstream routing
        if: ${{ (github.event_name == 'schedule' || inputs.publish) && success() }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/master-state
          cp MASTER_AUTOMATION_TRACKER.json MASTER_AUTOMATION_STATUS.json MASTER_TOPIC_HISTORY.json /tmp/master-state/
          git config user.name "Daily Yield Master Writer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main && git reset --hard FETCH_HEAD
            python merge_master_state.py MASTER_AUTOMATION_TRACKER.json /tmp/master-state/MASTER_AUTOMATION_TRACKER.json MASTER_AUTOMATION_TRACKER.merged.json published
            mv MASTER_AUTOMATION_TRACKER.merged.json MASTER_AUTOMATION_TRACKER.json
            python merge_master_state.py MASTER_TOPIC_HISTORY.json /tmp/master-state/MASTER_TOPIC_HISTORY.json MASTER_TOPIC_HISTORY.merged.json items
            mv MASTER_TOPIC_HISTORY.merged.json MASTER_TOPIC_HISTORY.json
            cp /tmp/master-state/MASTER_AUTOMATION_STATUS.json .
            git add MASTER_AUTOMATION_TRACKER.json MASTER_AUTOMATION_STATUS.json MASTER_TOPIC_HISTORY.json
            if git diff --staged --quiet; then exit 0; fi
            git commit -m "Record trending Master publication [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
      - name: Route confirmed publication to two social networks
        if: ${{ (github.event_name == 'schedule' || inputs.publish) && success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python dispatch_social_events.py
      - name: Trigger page refresh and Bing reconciliation
        if: ${{ (github.event_name == 'schedule' || inputs.publish) && success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in content_experience_repair.yml bing_url_automation.yml; do
            completed=false
            for attempt in 1 2 3; do
              if gh workflow run "$workflow" --ref main; then completed=true; break; fi
              sleep $((attempt * 3))
            done
            $completed || exit 1
          done
      - name: Requeue after package persistence or publication failure
        if: ${{ failure() && steps.prepare.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="${{ inputs.retry_attempt || '0' }}"
          if [ "$current" -lt 4 ]; then
            next=$((current+1))
            gh workflow run master_trending_writer.yml --ref main -f slot="${{ steps.slot.outputs.value }}" -f publish="${{ github.event_name == 'schedule' && 'true' || inputs.publish }}" -f retry_attempt="$next"
          fi
      - name: Preserve Master pipeline diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-trending-diagnostics-${{ github.run_id }}
          path: |
            MASTER_AUTOMATION_STATUS.json
            MASTER_PREPARATION_REPORT.json
          if-no-files-found: warn
          retention-days: 30
