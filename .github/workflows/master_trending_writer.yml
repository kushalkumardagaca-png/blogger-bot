name: Master Trending Writer (Live)

on:
  schedule:
    - cron: '0 1 * * *'    # Prepare 06:30 IST → live 07:45
    - cron: '0 7 * * *'    # Prepare 12:30 IST → live 13:45
    - cron: '30 9 * * *'   # Prepare 15:00 IST → live 16:15
    - cron: '30 12 * * *'  # Prepare 18:00 IST → live 19:15
    - cron: '30 13 * * *'  # Prepare 19:00 IST → live 20:15
  workflow_dispatch:
    inputs:
      slot:
        description: "Trending category slot, 0 through 4"
        required: true
        type: choice
        options: ['0','1','2','3','4']
      publish:
        description: "Publish after preparation; scheduled runs publish automatically"
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  models: read
  actions: write

concurrency:
  group: daily-yield-master-trending-${{ github.event.schedule || inputs.slot || github.run_id }}
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests Pillow ImageHash google-api-python-client google-auth
      - name: Select trending category slot
        id: slot
        run: |
          case "${{ github.event.schedule }}" in
            '0 1 * * *') value=0 ;;
            '0 7 * * *') value=1 ;;
            '30 9 * * *') value=2 ;;
            '30 12 * * *') value=3 ;;
            '30 13 * * *') value=4 ;;
            *) value="${{ inputs.slot }}" ;;
          esac
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - name: Research, write, validate and select three photos
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          GSC_SITE_PROPERTY: ${{ secrets.GSC_SITE_PROPERTY }}
        run: |
          for attempt in 1 2 3; do
            if python master_dynamic_pipeline.py --kind trending --slot "${{ steps.slot.outputs.value }}" --prepare; then
              exit 0
            fi
            echo "Preparation attempt $attempt failed; rolling back partial package state."
            git reset --hard HEAD
            git clean -fd master_packages/dynamic assets/master scheduled_ready
            sleep $((attempt * 20))
          done
          exit 1
      - name: Persist validated package and licensed photo assets first
        run: |
          git config user.name "Daily Yield Master Writer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add master_packages/dynamic assets/master PHOTO_USAGE_REGISTRY.json MASTER_AUTOMATION_STATUS.json MASTER_DAILY_PLAN.json scheduled_ready
          if ! git diff --staged --quiet; then
            git commit -m "Prepare dynamic trending Master package [skip ci]"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
      - name: Publish after successful validated preparation
        if: ${{ github.event_name == 'schedule' || inputs.publish }}
        env:
          MASTER_PUBLICATION_ENABLED: 'true'
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python master_dynamic_pipeline.py --kind trending --slot "${{ steps.slot.outputs.value }}" --publish ${{ github.event_name == 'schedule' && '--timed-release' || '' }}
      - name: Persist confirmed publication before downstream routing
        if: ${{ (github.event_name == 'schedule' || inputs.publish) && success() }}
        run: |
          git add MASTER_AUTOMATION_TRACKER.json MASTER_AUTOMATION_STATUS.json MASTER_TOPIC_HISTORY.json
          if ! git diff --staged --quiet; then
            git commit -m "Record trending Master publication [skip ci]"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
      - name: Route confirmed publication to two social networks
        if: ${{ (github.event_name == 'schedule' || inputs.publish) && success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python dispatch_social_events.py
      - name: Trigger page refresh and Bing reconciliation
        if: ${{ (github.event_name == 'schedule' || inputs.publish) && success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in content_experience_repair.yml bing_url_automation.yml; do
            completed=false
            for attempt in 1 2 3; do
              if gh workflow run "$workflow" --ref main; then completed=true; break; fi
              sleep $((attempt * 3))
            done
            $completed || exit 1
          done
      - name: Preserve Master pipeline diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-trending-diagnostics-${{ github.run_id }}
          path: |
            MASTER_AUTOMATION_STATUS.json
            MASTER_PREPARATION_REPORT.json
          if-no-files-found: warn
          retention-days: 30
