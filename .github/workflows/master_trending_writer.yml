name: Master Trending Writer (Live)

on:
  schedule:
    - cron: '0 1 * * *'    # Prepare 06:30 IST → live 07:45
    - cron: '0 7 * * *'    # Prepare 12:30 IST → live 13:45
    - cron: '30 9 * * *'   # Prepare 15:00 IST → live 16:15
    - cron: '30 12 * * *'  # Prepare 18:00 IST → live 19:15
    - cron: '30 13 * * *'  # Prepare 19:00 IST → live 20:15
  workflow_dispatch:
    inputs:
      slot:
        description: "Trending category slot, 0 through 4"
        required: true
        type: choice
        options: ['0','1','2','3','4']
      publish:
        description: "Publish after preparation; scheduled runs publish automatically"
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-yield-master-trending-${{ github.event.schedule || inputs.slot || github.run_id }}
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests Pillow ImageHash google-api-python-client google-auth
      - name: Select trending category slot
        id: slot
        run: |
          case "${{ github.event.schedule }}" in
            '0 1 * * *') value=0 ;;
            '0 7 * * *') value=1 ;;
            '30 9 * * *') value=2 ;;
            '30 12 * * *') value=3 ;;
            '30 13 * * *') value=4 ;;
            *) value="${{ inputs.slot }}" ;;
          esac
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - name: Research, write, validate and select three photos
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          GSC_SITE_PROPERTY: ${{ secrets.GSC_SITE_PROPERTY }}
        run: python master_dynamic_pipeline.py --kind trending --slot "${{ steps.slot.outputs.value }}" --prepare
      - name: Persist validated package and licensed photo assets first
        run: |
          git config user.name "Daily Yield Master Writer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add master_packages/dynamic assets/master PHOTO_USAGE_REGISTRY.json MASTER_AUTOMATION_STATUS.json scheduled_ready
          if ! git diff --staged --quiet; then
            git commit -m "Prepare dynamic trending Master package [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Publish after successful validated preparation
        if: ${{ github.event_name == 'schedule' || inputs.publish }}
        env:
          MASTER_PUBLICATION_ENABLED: 'true'
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python master_dynamic_pipeline.py --kind trending --slot "${{ steps.slot.outputs.value }}" --publish ${{ github.event_name == 'schedule' && '--timed-release' || '' }}
      - name: Route successful publication and refresh page
        if: ${{ (github.event_name == 'schedule' || inputs.publish) && success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python dispatch_social_events.py
          git add MASTER_AUTOMATION_TRACKER.json MASTER_AUTOMATION_STATUS.json MASTER_TOPIC_HISTORY.json
          if ! git diff --staged --quiet; then
            git commit -m "Record trending Master publication [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          gh workflow run content_experience_repair.yml --ref main
          gh workflow run bing_url_automation.yml --ref main
