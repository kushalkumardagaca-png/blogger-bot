name: Blogger Corpus Policy Hardening

on:
  # A request file is how a repair is started from a push, which is the only lever this
  # repository has from the desk (there is no API token here, only a deploy key). The
  # contents pick the scope; the script still refuses anything the freeze has not released,
  # so an unauthorised request is a no-op with a printed reason rather than a write.
  push:
    branches: [main]
    paths:
      - '.github/corpus-repair-request'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply the released repair: with "rights" scope, licence credits on photo figures only'
        required: true
        type: boolean
        default: false
      scope:
        description: 'rights = photo credits only (owner-released); duplicates = retire the newer copy of an edition published twice (owner-released 23 Oct); full = whole-site remediation (stays held by the freeze)'
        required: true
        type: choice
        options: ['rights','duplicates','full']
        default: 'rights'
  schedule:
    # Daily whole-site verification finishes before the main IST publication day.
    - cron: '55 18 * * *'
    # The figure-credit check, and the only self-healing write the owner has released.
    #
    # Why this exists at all: on 22 October 2026 an anti-plagiarism repair deleted the licence credit out
    # of two of three photographs on three live articles. The whole-site audit measured that as an
    # image-rights gap, the corpus status fell to WARNING, and the green operating gate - correctly -
    # refused every publication that depended on it. Nothing retried the repair, so the gap sat until the
    # next nightly audit and the whole of 23 October's morning was held behind it: 0 of 21 articles.
    # A gate that can shut the day down has to be paired with the narrow fix that reopens it, on a clock.
    # The ledger this job itself writes says whether any caption is still blank, so an unneeded pass is a
    # few seconds of reading a committed file rather than an authenticated walk over 598 posts.
    - cron: '17,47 * * * *'

permissions:
  contents: write

concurrency:
  group: daily-yield-blogger-corpus-hardening
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      needed: ${{ steps.look.outputs.needed }}
      repair: ${{ steps.look.outputs.repair }}
      scope: ${{ steps.look.outputs.scope }}
    steps:
      - uses: actions/checkout@v5
      - name: Is a repair owed today
        id: look
        env:
          EVENT_NAME: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          REQUESTED_APPLY: ${{ inputs.apply }}
          REQUESTED_SCOPE: ${{ inputs.scope }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          HEAL = "17,47 * * * *"
          event = os.environ.get("EVENT_NAME", "")
          cron = os.environ.get("CRON", "")
          requested = os.environ.get("REQUESTED_APPLY", "").casefold() == "true"
          scope = os.environ.get("REQUESTED_SCOPE", "") or "rights"

          gaps = 0
          try:
              gaps = int(json.loads(Path("BLOGGER_IMAGE_RIGHTS_LEDGER.json").read_text())
                         .get("posts_with_figure_rights_gaps") or 0)
          except Exception:
              # An unreadable ledger is not evidence that nothing is owed: the run proceeds and measures
              # the live corpus for itself, which is the safer answer when a status file is the trigger.
              gaps = 1
          # A twin is measured from the corpus audit's own report. It does not hold the day
          # behind the green gate - one duplicate article is a correction, not a danger - but
          # it is repaired on the same clock, because a duplicate left up is a duplicate that
          # the owner has to notice by eye.
          twins = 0
          try:
              twins = int(json.loads(Path("BLOGGER_CORPUS_POLICY_STATUS.json").read_text())
                          .get("recent_title_twins") or 0)
          except Exception:
              twins = 0
          # A push of the request file means "look now, and repair if the release covers it".
          requested_scope = ""
          if event == "push":
              try:
                  requested_scope = Path(".github/corpus-repair-request").read_text().strip().casefold()
              except OSError:
                  requested_scope = ""
              if requested_scope in ("", "audit"):
                  requested_scope = "rights"
              scope = requested_scope
              requested = True
          needed = True
          if event == "schedule" and cron == HEAL:
              needed = gaps > 0 or twins > 0
          auto = event == "schedule" and cron == HEAL
          repair = needed and (requested or auto)
          if event == "push":
              # The push route carries its own scope, so a `duplicates` request is not silently
              # narrowed to the rights repair by the `scope` input the dispatch form defaulted to.
              repair = True
          chosen = "duplicates" if (twins > 0 and scope in ("duplicates", "full")) or (auto and twins > 0) else scope
          if auto and gaps > 0 and twins > 0:
              # Both repairs are owed: credits first, because a caption gap is what held the
              # whole day on 23 October, and a twin can wait thirty minutes for the next pass.
              chosen = "rights"
          elif auto and twins > 0:
              chosen = "duplicates"
          elif auto:
              chosen = "rights"
          print(f"ledger gaps: {gaps}; recent twins: {twins}; audit needed: {needed}; "
                f"released repair: {repair}; scope: {chosen}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"needed={'true' if needed else 'false'}\n")
              out.write(f"repair={'true' if repair and chosen in ('rights', 'duplicates') else 'false'}\n")
              out.write(f"scope={chosen}\n")
          PY

  audit-and-remediate:
    needs: decide
    if: needs.decide.outputs.needed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Audit authenticated live corpus and apply only the released, idempotent repair
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          # Until 23 October 2026 this line read 'false' unconditionally, so the `apply` input the form
          # offered did nothing at all: a control that cannot be turned on is not a control, it is a
          # decoration, and the morning's desks were held for hours by a gap this job could have closed.
          # What is honoured now is only the scope the owner released - site_change_control answers for
          # that inside harden_live_corpus.py, where every other write this script knows stays frozen.
          APPLY_CORPUS_REMEDIATION: ${{ needs.decide.outputs.repair == 'true' && 'true' || 'false' }}
          CORPUS_REPAIR_SCOPE: ${{ needs.decide.outputs.repair == 'true' && needs.decide.outputs.scope || 'audit' }}
        run: python harden_live_corpus.py
      - name: Persist compact policy and image-rights evidence
        run: |
          set -euo pipefail
          cp BLOGGER_CORPUS_POLICY_STATUS.json /tmp/corpus-status.json
          cp BLOGGER_IMAGE_RIGHTS_LEDGER.json /tmp/rights-status.json
          git config user.name "Daily Yield Policy Hardening"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main && git reset --hard FETCH_HEAD
            cp /tmp/corpus-status.json BLOGGER_CORPUS_POLICY_STATUS.json
            cp /tmp/rights-status.json BLOGGER_IMAGE_RIGHTS_LEDGER.json
            git add BLOGGER_CORPUS_POLICY_STATUS.json BLOGGER_IMAGE_RIGHTS_LEDGER.json
          # A retirement is only honest with its before-image: the full post is kept in the
          # repository, so a copy reverted to a draft can be restored without Blogger's help.
          if compgen -G "duplicate_twin_backups/*.json" > /dev/null; then
            git add duplicate_twin_backups
          fi
            git commit -m "Record live Blogger corpus policy audit [skip ci]" || true
            git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blogger-corpus-policy-${{ github.run_id }}
          path: |
            BLOGGER_CORPUS_POLICY_STATUS.json
            BLOGGER_IMAGE_RIGHTS_LEDGER.json
            duplicate_twin_backups
          if-no-files-found: error
