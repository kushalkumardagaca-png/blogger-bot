name: Daily Yield Instagram Publisher

# Official Instagram Platform publishing only. Half-hourly sweep from 08:00 to 00:30
# IST: the publisher posts only what this repository can prove is live, keeps its own
# separate route ledger, and never touches the fixed "two posts per article across
# four networks" rule the owner set. Cadence lives in INSTAGRAM_PLAN.json.
#
# When the account is not connected yet the run stays green and records
# NOT_CONNECTED, because a missing credential is an owner-side step to schedule, not a
# publishing failure to chase at midnight.

on:
  schedule:
    - cron: '*/30 3-18 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: "sweep posts today's queue; health checks the connection only; preflight builds posts without sending them"
        required: true
        type: choice
        options: ['sweep', 'health', 'preflight']
        default: 'sweep'

permissions:
  contents: write

concurrency:
  group: daily-yield-instagram-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_IG_USER_ID: ${{ secrets.INSTAGRAM_IG_USER_ID }}
      INSTAGRAM_APP_ID: ${{ vars.INSTAGRAM_APP_ID }}
      INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
      INSTAGRAM_TOKEN_ENCRYPTION_KEY: ${{ secrets.INSTAGRAM_TOKEN_ENCRYPTION_KEY }}
      INSTAGRAM_API_MODE: ${{ vars.INSTAGRAM_API_MODE }}
      INSTAGRAM_GRAPH_VERSION: 'v26.0'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --quiet requests cryptography Pillow
      - name: Refresh a stored token before its 60-day expiry and read the account's own publishing cap
        run: |
          action="${{ github.event.inputs.action }}"
          [[ -n "$action" ]] || action="sweep"
          if [[ "$action" == "health" ]]; then
            python instagram_publisher.py --mode health
          elif [[ "$action" == "preflight" ]]; then
            python instagram_publisher.py --mode preflight
          else
            python instagram_publisher.py --mode health
            python instagram_publisher.py --mode sweep
          fi
      - name: Persist route evidence
        run: |
          git config user.name "Daily Yield Instagram Bot"
          git config user.email "bot@dailyyield.blogspot.com"
          git pull --rebase --autostash origin main
          # Stage first, then judge. "git diff --quiet" ignores untracked files, and these three
          # evidence files are untracked on the very first run, so an old guard here meant a brand
          # new file could never be committed - the route looked permanently silent even when it
          # had plenty to say.
          for file in instagram_tracker.json INSTAGRAM_ROUTE_STATUS.json SOCIAL_CREDENTIAL_HEALTH.json; do
            if [[ -f "$file" ]]; then
              git add -- "$file"
            fi
          done
          if git diff --cached --quiet; then
            echo "no route evidence changed"
          else
            git commit -q -m "Record Instagram route evidence [skip ci]" && git push -q origin main
          fi
