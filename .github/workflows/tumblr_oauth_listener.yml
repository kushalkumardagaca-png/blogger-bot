name: Tumblr Authorisation Listener

# Why this exists: a Tumblr authorization code is single-use and worth about thirty to sixty seconds,
# and a run that must be queued, checked out and installed before it reads the code always loses that
# race. So this job is started in advance and waits. When the owner pastes the callback address into
# .github/tumblr-oauth-code and commits it, the code is exchanged within seconds of that commit - no
# secret page, no dispatch box, no button, no ordering to remember. A refusal does not stop the watch.

on:
  push:
    paths:
      - .github/tumblr-oauth-listener
  workflow_dispatch:
    inputs:
      listen_minutes:
        description: "How many minutes to keep watching"
        required: false
        default: '170'

permissions:
  contents: write

concurrency:
  group: daily-yield-tumblr-oauth-listener
  cancel-in-progress: true

jobs:
  listen:
    name: Exchange a pasted code the moment it lands
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -c "import cryptography, requests" || python -m pip install --disable-pip-version-check requests cryptography
      - name: Watch for the code, exchange it, commit the token, scrub the file
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LISTENER_MINUTES: ${{ github.event.inputs.listen_minutes }}
          TUMBLR_CONSUMER_KEY: ${{ vars.TUMBLR_CONSUMER_KEY }}
          TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
          TUMBLR_TOKEN_ENCRYPTION_KEY: ${{ secrets.TUMBLR_TOKEN_ENCRYPTION_KEY }}
        run: python tumblr_oauth_listener.py
      - name: Say what the owner should do next
        if: ${{ !cancelled() }}
        run: |
          echo "If Tumblr is still not publishing, the fix is one paste: open"
          echo "  https://github.com/${GITHUB_REPOSITORY}/edit/main/.github/tumblr-oauth-code"
          echo "put the whole address bar value from Tumblr's callback on the line under the comments, and"
          echo "press Commit changes. A listener run that finished without a code can be restarted by"
          echo "committing mode: on to .github/tumblr-oauth-listener, or by running this workflow."
