name: Repair Daily Yield family directory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'page_family.py'
      - 'repair_family_directory.py'
      - 'test_page_family.py'
      - '.github/workflows/repair_family_directory.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: daily-yield-security-guard
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Verify repeat-safe family-directory controls
        run: python -m unittest test_page_family -v
      - name: Back up and repair every live Post and Page
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python repair_family_directory.py
      - name: Upload recovery backup and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-directory-repair-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: ignore
          path: |
            FAMILY_DIRECTORY_REPAIR_BACKUP.json.gz
            FAMILY_DIRECTORY_REPAIR_REPORT.json
            FAMILY_DIRECTORY_REPAIR_REPORT.md
      - name: Persist repair evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Daily Yield Family Directory Repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/dy-family-state
          for file in "${files[@]}"; do [[ -f "$file" ]] && cp "$file" /tmp/dy-family-state/; done
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/dy-family-state/* .
            git add "${files[@]}" 2>/dev/null || true
            if git diff --staged --quiet; then exit 0; fi
            git commit -m "Record family-directory repair evidence [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
