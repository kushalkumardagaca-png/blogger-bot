name: Master V3 Daily Advance Prewarmer

on:
  schedule:
    # The daily plan is due at 00:20 IST. Begin all complete packages shortly
    # afterward, leaving 4h35m-5h35m before the earliest Master release and much
    # larger margins for later slots.
    - cron: '10 19 * * *'  # 00:40 IST → slot pair 0
    - cron: '25 19 * * *'  # 00:55 IST → slot pair 1
    - cron: '40 19 * * *'  # 01:10 IST → slot pair 2
    - cron: '55 19 * * *'  # 01:25 IST → slot pair 3
    - cron: '10 20 * * *'  # 01:40 IST → slot pair 4
  workflow_dispatch:
    inputs:
      batch:
        description: 'Trending and Evergreen slot to prepare, 0 through 4'
        required: true
        type: choice
        options: ['0','1','2','3','4']

permissions:
  contents: read
  actions: write

concurrency:
  group: daily-yield-master-v3-prewarm-${{ github.event.schedule || inputs.batch || github.run_id }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Select package pair
        id: slot
        shell: bash
        run: |
          case "${{ github.event.schedule }}" in
            '10 19 * * *') value=0 ;;
            '25 19 * * *') value=1 ;;
            '40 19 * * *') value=2 ;;
            '55 19 * * *') value=3 ;;
            '10 20 * * *') value=4 ;;
            *) value="${{ inputs.batch }}" ;;
          esac
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - name: Prepare both complete packages without publishing early
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          slot='${{ steps.slot.outputs.value }}'
          dispatch() {
            local workflow="$1"
            # A run already queued or in progress for this workflow IS the dispatch we came to make.
            # Both Master writers hold a 20-minute preparation and share a concurrency group, so a
            # rejected "workflow_dispatch: too many runs in the queue" used to fail this job after five
            # tries - two red emails (here and in the child) for work that was already running. The
            # queue is checked first, and the answer is reused instead of fought.
            if [ "$(gh run list --workflow "$workflow" --branch main --status queued --status in_progress \
                    --json databaseId -q 'length' 2>/dev/null || echo 0)" != "0" ]; then
              echo "$workflow already has a queued or running attempt for slot $slot; nothing to dispatch."
              return 0
            fi
            for attempt in 1 2 3 4 5; do
              if gh workflow run "$workflow" --ref main -f slot="$slot" -f publish=false -f retry_attempt=0; then return 0; fi
              sleep $((attempt * 5))
            done
            if [ "$(gh run list --workflow "$workflow" --branch main --status queued --status in_progress \
                    --json databaseId -q 'length' 2>/dev/null || echo 0)" != "0" ]; then
              echo "::notice title=Dispatch already covered::$workflow picked up a queued attempt; the five rejections were the queue, not the API"
              return 0
            fi
            echo "Unable to dispatch $workflow after five attempts, and no run of it is queued or in progress" >&2
            return 1
          }
          # Dispatch independently so a transient API failure for one category
          # cannot silently prevent its paired category from preparing.
          failed=0
          dispatch master_trending_writer.yml || failed=1
          dispatch master_evergreen_writer.yml || failed=1
          [ "$failed" -eq 0 ] || exit 1
          echo "Dispatched complete V3 evidence, text, validation and three-photo preparation for slot $slot."
