name: Tumblr OAuth Bootstrap

on:
  workflow_dispatch:
    inputs:
      wait_for_code_minutes:
        description: "Minutes to wait for you to save a fresh code after pressing Run (0 = try whatever is saved now)"
        required: false
        default: '4'

permissions:
  contents: write
  actions: read
  secrets: read

concurrency:
  group: daily-yield-tumblr-oauth
  cancel-in-progress: false

jobs:
  wait-for-code:
    # A Tumblr authorization code is single-use and worth only minutes, and GitHub fixes a job's
    # secrets when that job starts. So waiting happens in its own job and the exchange happens in the
    # job after it, which reads whatever value is saved at that moment. Press Run workflow first,
    # then Approve, then Update the secret: the wait ends about five seconds after the save.
    name: Wait for the code to be saved
    if: ${{ inputs.wait_for_code_minutes != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Hold until a newer code appears in the secret
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SECRET: TUMBLR_AUTHORIZATION_CODE
          LIMIT: ${{ inputs.wait_for_code_minutes }}
          STARTED: ${{ github.run_started_at }}
        run: |
          set -u
          # A dispatch input is free text, and bash arithmetic on 0.5 or hello aborts the job, so a
          # value that is not a whole number of minutes quietly becomes the default of four.
          minutes=4
          case "${LIMIT:-}" in
            ''|*[!0-9]*) [ -n "${LIMIT:-}" ] && [ "$LIMIT" != "0" ] && echo "wait_for_code_minutes must be a whole number of minutes, or 0 to skip the wait, so 4 is used instead." ;;
            *) minutes=$(( LIMIT )) ;;
          esac
          if [ "$minutes" -gt 9 ]; then
            echo "the wait is capped at 9 minutes so a queued run cannot sit on a code worth minutes, so 9 is used."
            minutes=9
          fi
          limit=$(( minutes * 60 ))
          started="$(date -u -d "$STARTED" +%s 2>/dev/null || date -u +%s)"
          echo "If you have not pressed Approve on Tumblr yet, do that now and then Update the $SECRET secret."
          echo "The old saved value is deliberately ignored: it is worth nothing."
          waited=0
          while [ "$waited" -lt "$limit" ]; do
            saved="$(gh api "repos/$REPO/actions/secrets/$SECRET" --jq .updated_at 2>/dev/null || true)"
            if [ -n "$saved" ]; then
              saved_at="$(date -u -d "$saved" +%s 2>/dev/null || echo 0)"
              if [ "$saved_at" -gt "$started" ]; then
                echo "A code was saved at $saved, $(( saved_at - started ))s after this run began. Exchanging it now."
                exit 0
              fi
            fi
            sleep 5
            waited=$(( waited + 5 ))
            echo "still waiting for a newer code ($waited of $limit seconds)"
          done
          echo "No newer code appeared within $minutes minutes, so the value already saved is tried, and Tumblr will most likely answer that it expired."

  authorize:
    name: Exchange the code, encrypt the token and record the outcome
    needs: wait-for-code
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Skipping the install when both modules already exist takes about twenty seconds off every
      # attempt, and a one-time authorisation code is worth only minutes: every second of queue time
      # is a chance for Tumblr to retire the code before the exchange reaches it.
      - run: python -c "import cryptography, requests" || python -m pip install --disable-pip-version-check requests cryptography
      - name: Exchange one-time code and encrypt offline token
        env:
          TUMBLR_CONSUMER_KEY: ${{ vars.TUMBLR_CONSUMER_KEY }}
          TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
          TUMBLR_AUTHORIZATION_CODE: ${{ secrets.TUMBLR_AUTHORIZATION_CODE }}
          TUMBLR_TOKEN_ENCRYPTION_KEY: ${{ secrets.TUMBLR_TOKEN_ENCRYPTION_KEY }}
        run: |
          set +e
          # Neither the one-time code nor any token is echoed here: only the words Tumblr itself
          # used, so a refused exchange can be read on the run page without log access. Bash reads
          # quotes inside a ${var:-default} expansion as syntax, so no apostrophes are used there.
          fingerprint="$(printf '%s' "${TUMBLR_AUTHORIZATION_CODE:-}" | sha256sum | cut -c1-12)"
          previous="$(python tumblr_attempt_record.py previous)"
          python tumblr_oauth_bootstrap.py 2>/tmp/tumblr-bootstrap.err
          code=$?
          cat /tmp/tumblr-bootstrap.err
          python social_credential_health.py --platform tumblr --code "$code" --output /tmp/tumblr-bootstrap.err || true
          reason="$(python social_credential_health.py --platform tumblr --extract --output /tmp/tumblr-bootstrap.err 2>/dev/null)"
          printf '%s' "$reason" > /tmp/tumblr-bootstrap.reason
          python tumblr_attempt_record.py record --fingerprint "$fingerprint" --code "$code" --reason-file /tmp/tumblr-bootstrap.reason || true
          if [ "$code" != "0" ]; then
            printf '::error title=Tumblr authorisation could not be completed::%s\n' "${reason:-see the message above}"
            if [ "$previous" = "$fingerprint" ]; then
              printf '%s\n' "This is the SAME code as the previous attempt, which Tumblr already retired, so re-running alone can never work: open the authorise link, press Approve for a brand-new code, Update the TUMBLR_AUTHORIZATION_CODE secret with it, then re-run this workflow in the same sitting."
            else
              printf '%s\n' "A one-time code is worth minutes, not hours. Press Approve again for a fresh code, Update the TUMBLR_AUTHORIZATION_CODE secret, then re-run this workflow straight away."
            fi
          else
            printf '%s\n' "Tumblr is authorised again: the social guard will resume the Tumblr routes on its next sweep, and the posts held back so far go out with it. Clear the TUMBLR_AUTHORIZATION_CODE secret now."
          fi
          exit "$code"
      - name: Commit encrypted token bundle
        if: ${{ !cancelled() }}
        run: |
          git config user.name "Daily Yield Tumblr OAuth"
          git config user.email "bot@dailyyield.blogspot.com"
          git add tumblr_token.enc TUMBLR_OAUTH_ATTEMPT.json
          [ -f SOCIAL_CREDENTIAL_HEALTH.json ] && git add SOCIAL_CREDENTIAL_HEALTH.json
          if git diff --staged --quiet; then
            echo "Nothing changed: this bundle is already the one in the repository."
            exit 0
          fi
          git commit -m "Initialize encrypted Tumblr authorization [skip ci]"
          git pull --rebase origin main
          git push origin main
