name: Tumblr OAuth Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-yield-tumblr-oauth
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests cryptography
      - name: Exchange one-time code and encrypt offline token
        env:
          TUMBLR_CONSUMER_KEY: ${{ vars.TUMBLR_CONSUMER_KEY }}
          TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
          TUMBLR_AUTHORIZATION_CODE: ${{ secrets.TUMBLR_AUTHORIZATION_CODE }}
          TUMBLR_TOKEN_ENCRYPTION_KEY: ${{ secrets.TUMBLR_TOKEN_ENCRYPTION_KEY }}
        run: |
          set +e
          # Neither the one-time code nor any token is echoed here: only the words Tumblr itself
          # used, so a refused exchange can be read on the run page without log access. No
          # apostrophes inside a ${var:-default} expansion, which bash reads as shell syntax.
          python tumblr_oauth_bootstrap.py 2>/tmp/tumblr-bootstrap.err
          code=$?
          cat /tmp/tumblr-bootstrap.err
          python social_credential_health.py --platform tumblr --code "$code" --output /tmp/tumblr-bootstrap.err || true
          reason="$(python social_credential_health.py --platform tumblr --extract --output /tmp/tumblr-bootstrap.err 2>/dev/null)"
          if [ "$code" != "0" ]; then
            printf '::error title=Tumblr authorisation could not be completed::%s\n' "${reason:-see the message above}"
            printf '%s\n' "Repair: the one-time code is single-use and Tumblr retires it in minutes, so get a fresh one, press Update on the TUMBLR_AUTHORIZATION_CODE secret, and re-run this workflow in the same sitting."
          else
            printf '%s\n' "Tumblr is authorised again: the social guard will resume the Tumblr routes on its next sweep."
          fi
          exit "$code"
      - name: Commit encrypted token bundle
        if: ${{ !cancelled() }}
        run: |
          git config user.name "Daily Yield Tumblr OAuth"
          git config user.email "bot@dailyyield.blogspot.com"
          git add tumblr_token.enc
          [ -f SOCIAL_CREDENTIAL_HEALTH.json ] && git add SOCIAL_CREDENTIAL_HEALTH.json
          if git diff --staged --quiet; then
            echo "Nothing changed: this bundle is already the one in the repository."
            exit 0
          fi
          git commit -m "Initialize encrypted Tumblr authorization [skip ci]"
          git pull --rebase origin main
          git push origin main
