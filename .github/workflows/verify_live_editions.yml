name: Verify Live Editions

# Runs the same verification the recovery controller uses, and prints the reason
# for every desk, so a failing record names its cause. Authenticated API reads
# only: no public page request, no pageview added.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'verify_live_editions.py'
      - '.github/workflows/verify_live_editions.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install --quiet requests
      - name: Verify every recorded edition against the live post
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python verify_live_editions.py
      - name: Persist the verification evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Daily Yield Arena Controller"
          git config user.email "dailyyield.official@gmail.com"
          mkdir -p /tmp/dy-verify
          cp LIVE_EDITION_VERIFICATION.json /tmp/dy-verify/ 2>/dev/null || true
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/dy-verify/* . 2>/dev/null || true
            git add LIVE_EDITION_VERIFICATION.json 2>/dev/null || true
            if git diff --staged --quiet; then exit 0; fi
            git commit -m "Record live edition verification evidence [skip ci]" || true
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
