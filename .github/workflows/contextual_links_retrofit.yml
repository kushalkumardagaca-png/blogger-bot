name: Add contextual links and repair article images
on:
  schedule:
    # Weekly audit-only link and image hygiene; no automatic Blogger mutation.
    - cron: '30 18 * * 0'
  workflow_dispatch:
    inputs:
      apply:
        description: Apply updates to Blogger
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
permissions:
  contents: read
jobs:
  retrofit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit and optionally update all Posts
        env:
          APPLY: ${{ inputs.apply }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python contextual_links_retrofit.py
      - uses: actions/upload-artifact@v4
        with:
          name: contextual-links-${{ inputs.apply }}
          retention-days: 30
          path: |
            CONTEXTUAL_LINKS_AUDIT.json
            contextual_links_backup.json
