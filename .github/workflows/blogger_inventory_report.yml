name: Blogger Inventory Report

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/blogger-inventory-trigger'

permissions:
  contents: write

concurrency:
  group: blogger-inventory-report
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Report authenticated live, draft and scheduled inventory
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: |
          set +e
          python blogger_inventory_report.py 2>&1 | tee /tmp/inventory.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            tail -c 900 /tmp/inventory.log | sed 's/%/%25/g;s/\r//g' | while IFS= read -r line; do echo "::error::$line"; done
            exit "$code"
          fi
      - name: Publish inventory result as readable annotations
        if: success()
        run: |
          python - <<'PYFACTS'
          import json
          d=json.load(open('BLOGGER_INVENTORY_STATUS.json'))
          print(f"::notice::live={d['live_posts']} draft={d['draft_posts']} scheduled={d['scheduled_posts']} draft_copies_of_live={len(d['drafts_matching_a_live_post'])} unique_drafts={len(d['drafts_with_no_live_match'])}")
          for row in d.get('quarantine_still_live') or []:
              print(f"::error title=Quarantined post is still live::{row.get('post_id')} {row.get('label')} {row.get('url')}")
              print(f"::error title=Quarantine disclosure missing::post {row.get('post_id')} disclosure={row.get('has_current_disclosure')}")
          for row in d['draft_unique' if False else 'drafts_with_no_live_match']:
              print(f"::notice title=Unique draft::{(row.get('updated') or '')[:16]} {str(row.get('title'))[:70]}")
          for row in d['drafts_matching_a_live_post']:
              print(f"::notice title=Draft copy of a live post::{str(row.get('title'))[:70]} -> {row.get('live_url')}")
          missing=[x for x in d['master_plan_today'] if not x['live']]
          for row in missing:print(f"::warning title=Master still missing today::{row['key']} {row['title']}")
          print(f"::notice::master_live_today={sum(1 for x in d['master_plan_today'] if x['live'])} of {len(d['master_plan_today'])}; news_live_today={len(d['news_live_today'])}")
          PYFACTS
      - name: Preserve inventory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blogger-inventory-${{ github.run_id }}
          retention-days: 30
          path: BLOGGER_INVENTORY_STATUS.json
          if-no-files-found: warn
      - name: Persist inventory evidence
        if: success()
        continue-on-error: true
        run: |
          set -euo pipefail
          cp BLOGGER_INVENTORY_STATUS.json /tmp/inventory-report.json
          git config user.name 'Daily Yield Inventory'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main && git reset --hard FETCH_HEAD
            cp /tmp/inventory-report.json BLOGGER_INVENTORY_STATUS.json
            git add BLOGGER_INVENTORY_STATUS.json
            if git diff --staged --quiet; then exit 0; fi
            git commit -m 'Update Blogger inventory evidence [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
