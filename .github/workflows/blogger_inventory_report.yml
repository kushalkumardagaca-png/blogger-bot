name: Blogger Inventory Report

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/blogger-inventory-trigger'

permissions:
  contents: write

concurrency:
  group: blogger-inventory-report
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Report authenticated live, draft and scheduled inventory
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python blogger_inventory_report.py
      - name: Preserve inventory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blogger-inventory-${{ github.run_id }}
          retention-days: 30
          path: BLOGGER_INVENTORY_STATUS.json
          if-no-files-found: warn
      - name: Persist inventory evidence
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'Daily Yield Inventory'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main && git reset --hard FETCH_HEAD
            python blogger_inventory_report.py >/dev/null
            git add BLOGGER_INVENTORY_STATUS.json
            if git diff --staged --quiet; then exit 0; fi
            git commit -m 'Update Blogger inventory evidence [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
