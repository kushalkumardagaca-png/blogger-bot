name: Approve completed inactive-social cleanup once

on:
  push:
    branches: [main]
    paths: ['.github/workflows/approve_inactive_cleanup_once.yml']

permissions:
  contents: write

concurrency:
  group: daily-yield-security-guard
  cancel-in-progress: false

jobs:
  approve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Approve the completed authenticated Blogger cleanup
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python security_guard.py --approve-current
      - name: Persist approved baseline safely
        run: |
          cp SECURITY_BASELINE.json /tmp/SECURITY_BASELINE.json
          cp SECURITY_STATUS.json /tmp/SECURITY_STATUS.json
          cp SECURITY_STATUS.md /tmp/SECURITY_STATUS.md
          git config user.name 'Daily Yield Security Guard'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/SECURITY_BASELINE.json /tmp/SECURITY_STATUS.json /tmp/SECURITY_STATUS.md .
            git add SECURITY_BASELINE.json SECURITY_STATUS.json SECURITY_STATUS.md
            if git diff --staged --quiet; then exit 0; fi
            git commit -m 'Approve completed inactive-social cleanup [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
