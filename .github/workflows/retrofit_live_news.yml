name: Retrofit live news to current policy
on:
  # Current News is born policy-compliant; keep this only for deliberate legacy repair.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retrofit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Update today's existing news posts
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python retrofit_live_news.py
      - uses: actions/upload-artifact@v4
        with:
          name: retrofitted-live-news
          path: retrofit_live_news_result.json
          retention-days: 30
