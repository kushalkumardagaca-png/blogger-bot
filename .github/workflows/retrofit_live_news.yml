name: Retrofit live news to current policy
on:
  schedule:
    # Daily after the final 22:00 IST News desk; idempotently aligns today's News.
    - cron: '15 17 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retrofit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Update today's existing news posts
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python retrofit_live_news.py
      - uses: actions/upload-artifact@v4
        with:
          name: retrofitted-live-news
          path: retrofit_live_news_result.json
          retention-days: 30
