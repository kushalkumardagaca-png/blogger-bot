name: Daily Yield News Wires (20 Daily)
on:
  schedule:
    # Each cluster starts 45 minutes before its first editorial slot (IST).
    # A paired second desk receives 50–60 minutes of runway and runs sequentially.
    - cron: "15 22 * * *"   # 03:45 IST → Australia 04:30, South Korea 04:35
    - cron: "15 0 * * *"    # 05:45 IST → Global 06:30, India 06:45
    - cron: "45 2 * * *"    # 08:15 IST → Market 09:00, Macro 09:05
    - cron: "15 4 * * *"    # 09:45 IST → Germany 10:30, France 10:35
    - cron: "45 5 * * *"    # 11:15 IST → UK 12:00, Japan 12:05
    - cron: "45 6 * * *"    # 12:15 IST → China 13:00, Spain 13:05
    - cron: "30 9 * * *"    # 15:00 IST → Corporate 15:45, Italy 15:50
    - cron: "45 10 * * *"   # 16:15 IST → Brazil 17:00
    - cron: "45 11 * * *"   # 17:15 IST → US 18:00, Canada 18:05
    - cron: "15 13 * * *"   # 18:45 IST → Mexico 19:30
    - cron: "45 14 * * *"   # 20:15 IST → Personal Finance 21:00
    - cron: "45 15 * * *"   # 21:15 IST → Russia 22:00
  workflow_dispatch:
    inputs:
      desks:
        description: "desk slugs (comma-separated), or blank for desks due in the preflight window"
        required: false
        default: ""
permissions:
  contents: write
  actions: write
concurrency:
  group: daily-yield-news-wires
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Run Daily Yield news pipeline
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.desks }}" ]; then
            python3 news_pipeline.py --desks "${{ github.event.inputs.desks }}"
          else
            python3 news_pipeline.py --due
          fi
      - name: Route each live News edition to exactly one social platform
        env:
          GH_TOKEN: ${{ github.token }}
        run: python dispatch_social_events.py
      - name: Commit news tracker
        if: always()
        run: |
          git config user.name "Daily Yield News Bot"
          git config user.email "bot@dailyyield.blogspot.com"
          git add news_tracker.json || true
          if git diff --staged --quiet; then
            echo "No tracker change."
          else
            git commit -m "Update Daily Yield news tracker [$(date -u)]"
            git pull --rebase origin main
            git push origin main
          fi
