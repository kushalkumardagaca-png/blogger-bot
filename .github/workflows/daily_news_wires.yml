name: Daily Yield News Wires (11 Daily)
on:
  # Temporary catch-up trigger: this workflow-file update immediately retries
  # any edition missed by a failed scheduled run. Remove after the recovery run.
  push:
    branches: [main]
    paths: ['.github/workflows/daily_news_wires.yml']
  schedule:
    # Each run starts 45 minutes before its editorial slot (IST).
    - cron: "45 23 * * *"   # 05:15 IST → Americas 06:00
    - cron: "45 0 * * *"    # 06:15 IST → Global 07:00
    - cron: "30 1 * * *"    # 07:00 IST → Markets 07:45
    - cron: "15 2 * * *"    # 07:45 IST → Economy 08:30
    - cron: "0 3 * * *"     # 08:30 IST → Banking 09:15
    - cron: "45 3 * * *"    # 09:15 IST → Companies 10:00
    - cron: "45 6 * * *"    # 12:15 IST → China 13:00
    - cron: "30 7 * * *"    # 13:00 IST → Asia-Pacific 13:45
    - cron: "45 11 * * *"   # 17:15 IST → India 18:00
    - cron: "45 15 * * *"   # 21:15 IST → Russia 22:00
    - cron: "45 16 * * *"   # 22:15 IST → Europe 23:00
  workflow_dispatch:
    inputs:
      desks:
        description: "desk slugs (comma-separated), or blank for desks due in the preflight window"
        required: false
        default: ""
permissions:
  contents: write
  actions: write
concurrency:
  group: daily-yield-news-wires
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Run Daily Yield news pipeline
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python3 news_pipeline.py --desks "americas,markets,economy"
          elif [ -n "${{ github.event.inputs.desks }}" ]; then
            python3 news_pipeline.py --desks "${{ github.event.inputs.desks }}"
          else
            python3 news_pipeline.py --due
          fi
      - name: Route each live News edition to exactly one social platform
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python dispatch_social_events.py
      - name: Preserve pipeline diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-pipeline-status-${{ github.run_id }}
          path: NEWS_PIPELINE_STATUS.json
          if-no-files-found: warn
          retention-days: 30
      - name: Commit news tracker and diagnostic status
        if: always()
        run: |
          git config user.name "Daily Yield News Bot"
          git config user.email "bot@dailyyield.blogspot.com"
          git add news_tracker.json NEWS_PIPELINE_STATUS.json || true
          if git diff --staged --quiet; then
            echo "No tracker change."
          else
            git commit -m "Update Daily Yield news tracker [$(date -u)]"
            git pull --rebase origin main
            git push origin main
          fi
      - name: Trigger authenticated News-page refresh
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run content_experience_repair.yml --ref main
      - name: Trigger Bing URL submission reconciliation
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bing_url_automation.yml --ref main
