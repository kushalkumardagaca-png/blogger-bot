name: Daily Yield News Wires (11 Daily)
on:
  schedule:
    # Preparation starts 75 minutes before each audience-aligned release.
    # News keeps its geographic reader windows; Masters fill the daytime gaps.
    - cron: "30 21 * * *"   # 03:00 IST → Asia-Pacific live 04:15
    - cron: "30 22 * * *"   # 04:00 IST → China live 05:15
    - cron: "30 0 * * *"    # 06:00 IST → India live 07:15
    - cron: "30 3 * * *"    # 09:00 IST → Russia live 10:15
    - cron: "30 5 * * *"    # 11:00 IST → Markets live 12:15
    - cron: "0 6 * * *"     # 11:30 IST → Europe live 12:45
    - cron: "30 6 * * *"    # 12:00 IST → Economy live 13:15
    - cron: "30 10 * * *"   # 16:00 IST → Americas live 17:15
    - cron: "0 11 * * *"    # 16:30 IST → Companies live 17:45
    - cron: "30 11 * * *"   # 17:00 IST → Global live 18:15
    - cron: "0 12 * * *"    # 17:30 IST → Banking live 18:45
  workflow_dispatch:
    inputs:
      desks:
        description: "desk slugs (comma-separated); manual runs publish immediately"
        required: false
        default: ""
permissions:
  contents: write
  actions: write
concurrency:
  # Keyed by the trigger, which is how two runs publishing the SAME desk ended up side by
  # side on 23 October: the 04:45 IST Americas edition was written twice, one minute apart,
  # because a scheduled run sits in a different group from a dispatched one and an empty
  # `inputs.desks` fell through to `github.run_id` - a group unique to every run, which is
  # not a lock at all. Every manual/recovery dispatch now queues behind the one before it;
  # a scheduled desk keeps its own group so the eleven daily slots never wait on each other.
  group: ${{ github.event_name == 'schedule' && format('daily-yield-news-{0}', github.event.schedule) || 'daily-yield-news-dispatch' }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - name: Select scheduled desk
        id: desk
        shell: bash
        run: |
          case "${{ github.event.schedule }}" in
            '30 21 * * *') value=asia-pacific ;;
            '30 22 * * *') value=china ;;
            '30 0 * * *') value=india ;;
            '30 3 * * *') value=russia ;;
            '30 5 * * *') value=markets ;;
            '0 6 * * *') value=europe ;;
            '30 6 * * *') value=economy ;;
            '30 10 * * *') value=americas ;;
            '0 11 * * *') value=companies ;;
            '30 11 * * *') value=global ;;
            '0 12 * * *') value=banking ;;
            *) value="${{ inputs.desks }}" ;;
          esac
          echo "value=$value" >> "$GITHUB_OUTPUT"
          # GitHub's scheduler can start a run late (the China edition of 16 October
          # began after its own slot and published 62 minutes behind the timetable).
          # When that happens the scheduled desk either is already live or has left
          # its window, so this run takes the earliest desk that can still publish
          # on time instead of producing a late edition nobody is waiting for.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            chosen="$(python3 select_news_desk.py "$value")"
            echo "value=$chosen" >> "$GITHUB_OUTPUT"
            echo "Desk selected for this run: $chosen (scheduled: $value)"
          fi
      - name: Prepare and precision-publish Daily Yield News
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            args="--timed-release"
          else
            args=""
          fi
          # Prepared ahead, released on time: each scheduled run starts well before
          # its desk's slot so research and rendering finish early and the edition
          # waits for its minute instead of being written against the clock.
          echo "Run start: $(TZ=Asia/Kolkata date '+%H:%M IST') for desk ${{ steps.desk.outputs.value }}"
          if ! python3 -u news_pipeline.py --desks "${{ steps.desk.outputs.value }}" $args > /tmp/news.log 2>&1; then
            echo "::error title=News publish failed (${{ steps.desk.outputs.value }})::$(tail -c 1200 /tmp/news.log | tr '\n' '|')"
            grep -E "Error|error|Traceback|raise|FAIL|failed|gate|outside|Exception" /tmp/news.log | tail -30
            exit 1
          fi
          tail -40 /tmp/news.log
      - name: Route each live News edition to two different social platforms
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python dispatch_social_events.py
      - name: Preserve pipeline diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-pipeline-status-${{ github.run_id }}
          path: NEWS_PIPELINE_STATUS.json
          if-no-files-found: warn
          retention-days: 30
      - name: Commit confirmed News state, and always the reason a run failed
        # On a successful run the tracker and the status go together. On a failed run the status goes
        # alone: it holds the per-desk error the annotation was too small to carry, and a red run whose
        # reason dies with the runner is how a desk stayed broken for two days without anyone reading why.
        # The tracker is never committed from a failed run, because a half-written day must not be merged.
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          status_only=""
          if [ "${{ job.status }}" != "success" ]; then status_only=yes; fi
          git config user.name "Daily Yield News Bot"
          git config user.email "bot@dailyyield.blogspot.com"
          mkdir -p /tmp/news-state
          # Either file can be missing on a run that died early, and a persistence step that fails
          # because the failure was too early to leave evidence would be its own new red email.
          cp news_tracker.json /tmp/news-state/ 2>/dev/null || true
          cp NEWS_PIPELINE_STATUS.json /tmp/news-state/ 2>/dev/null || true
          if [ ! -f /tmp/news-state/news_tracker.json ] && [ ! -f /tmp/news-state/NEWS_PIPELINE_STATUS.json ]; then
            echo "Nothing to persist: the run stopped before it wrote a tracker or a status."
            exit 0
          fi
          # The prepared photo pools and their rotation state travel with the
          # pipeline state, so a repaired or republished desk keeps using fresh
          # photographs rather than starting its rotation again.
          git restore social_events.json 2>/dev/null || true
          for attempt in 1 2 3 4 5; do
            git fetch origin main && git reset --hard FETCH_HEAD
            if [ -n "$status_only" ]; then
              if [ ! -f /tmp/news-state/NEWS_PIPELINE_STATUS.json ]; then echo "No status file to record."; exit 0; fi
              cp /tmp/news-state/NEWS_PIPELINE_STATUS.json .
              git add NEWS_PIPELINE_STATUS.json
              if git diff --staged --quiet; then echo "No failure state to record."; exit 0; fi
              git commit -q -m "Record why the news run failed [skip ci]"
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2)); continue
            fi
            python merge_news_state.py news_tracker.json /tmp/news-state/news_tracker.json news_tracker.merged.json
            mv news_tracker.merged.json news_tracker.json
            cp /tmp/news-state/NEWS_PIPELINE_STATUS.json .
            git add news_tracker.json NEWS_PIPELINE_STATUS.json
            git add -A photo_library 2>/dev/null || true
            git add -A PHOTO_LIBRARY_STATUS.json 2>/dev/null || true
            if git diff --staged --quiet; then echo "No tracker change."; exit 0; fi
            git commit -m "Update Daily Yield news tracker [$(date -u)]"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
      - name: Trigger authenticated News-page refresh
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run content_experience_repair.yml --ref main