name: One-Time Master Trending Slot 4 Recovery

on:
  push:
    paths:
      - '.github/workflows/master_trending_slot4_recovery.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: one-time-master-trending-slot-4-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests Pillow ImageHash google-api-python-client google-auth
      - name: Rebuild failed trending package with resilient source discovery
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          GSC_SITE_PROPERTY: ${{ secrets.GSC_SITE_PROPERTY }}
        run: |
          for attempt in 1 2; do
            if python master_dynamic_pipeline.py --kind trending --slot 4 --prepare; then exit 0; fi
            echo "Recovery preparation attempt $attempt failed."
            sleep $((attempt * 20))
          done
          exit 1
      - name: Persist validated package and licensed photos
        run: |
          git config user.name "Daily Yield Master Recovery"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add master_packages/dynamic assets/master PHOTO_USAGE_REGISTRY.json MASTER_AUTOMATION_STATUS.json scheduled_ready
          if ! git diff --staged --quiet; then
            git commit -m "Recover trending Master slot 4 package [skip ci]"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
      - name: Publish or safely recover exact-title Blogger post
        env:
          MASTER_PUBLICATION_ENABLED: 'true'
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python master_dynamic_pipeline.py --kind trending --slot 4 --publish
      - name: Persist confirmed publication before social dispatch
        run: |
          git add MASTER_AUTOMATION_TRACKER.json MASTER_AUTOMATION_STATUS.json MASTER_TOPIC_HISTORY.json
          if ! git diff --staged --quiet; then
            git commit -m "Record recovered trending Master publication [skip ci]"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
      - name: Dispatch both required social routes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python dispatch_social_events.py
      - name: Refresh article page and Bing reconciliation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run content_experience_repair.yml --ref main
          gh workflow run bing_url_automation.yml --ref main
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trending-slot-4-recovery-${{ github.run_id }}
          path: |
            MASTER_AUTOMATION_STATUS.json
            MASTER_PREPARATION_REPORT.json
          if-no-files-found: warn
          retention-days: 30
