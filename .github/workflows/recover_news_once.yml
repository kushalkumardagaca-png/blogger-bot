name: Recover missed South Korea News edition once

on:
  push:
    branches: [main]
    paths: ['.github/workflows/recover_news_once.yml']

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-yield-news-wires
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Publish or safely recover today's missed South Korea edition
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python3 news_pipeline.py --desks south-korea
      - name: Route the recovered live edition once
        env:
          GH_TOKEN: ${{ github.token }}
        run: python dispatch_social_events.py
      - name: Persist tracker
        if: always()
        run: |
          git config user.name 'Daily Yield News Recovery Bot'
          git config user.email 'bot@dailyyield.blogspot.com'
          git add news_tracker.json
          if git diff --staged --quiet; then
            echo 'No tracker change.'
          else
            git commit -m 'Recover missed South Korea News edition [skip ci]'
            git pull --rebase origin main
            git push origin main
          fi
