name: One-Time Master Target Discovery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one_time_master_target_discovery.yml']
permissions: {contents: write}
concurrency: {group: daily-yield-master-publisher, cancel-in-progress: false}
jobs:
  discover:
    if: contains(github.event.head_commit.message, '[discover master]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pillow imagehash requests
      - run: python rewrite_existing_masters.py backup-next
      - run: |
          set -euo pipefail
          git config user.name "Daily Yield Master Migration"
          git config user.email "bot@dailyyield.blogspot.com"
          git add MASTER_REWRITE_STATE.json MASTER_REWRITE_REPORT.json master_rewrite_backups
          git commit -m "Back up next approved Master target [skip ci]"
          for attempt in {1..12}; do git pull --rebase origin main; if git push origin HEAD:main; then exit 0; fi; sleep $((attempt * 2)); done
          exit 1
