name: Blog Health Monitor (12x Daily Zero-View Watchdog)
# Workflow updates are applied through the repository-scoped deployment bridge.

on:
  push:
    branches: [main]
    paths:
      - 'theme/**'
      - 'audit_site_enhancements.py'
      - 'search_reach.py'
      - 'publication_preflight.py'
      - 'zero_view_watchdog.py'
      - '.github/workflows/health_monitor.yml'
  schedule:
    # Twelve independent API/source checks daily. No public Daily Yield URL is opened.
    - cron: '15 */2 * * *'
  workflow_dispatch:

concurrency:
  group: zero-view-full-site-watchdog
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify publishing automation invariants
        run: python audit_publishing_automation.py --check-only

      - name: Enforce zero-synthetic-view policy
        run: python audit_zero_view_policy.py

      - name: Audit Theme v4 reader, accessibility and SEO requirements
        run: python audit_site_enhancements.py

      - name: Verify search reach and submit Bing sitemaps when configured
        env:
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
        run: python search_reach.py

      - name: Audit complete site through APIs without opening the blog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
        run: python zero_view_watchdog.py

      - name: Upload zero-view evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zero-view-watchdog-${{ github.run_id }}
          retention-days: 30
          path: |
            ZERO_VIEW_WATCHDOG.json
            ZERO_VIEW_WATCHDOG.md
            HEALTH_STATUS.json
            HEALTH_REPORT.md
            COMPREHENSIVE_SITE_AUDIT.json
            COMPREHENSIVE_SITE_AUDIT.md
            RENDERED_SITE_AUDIT.json
            WATCHDOG_VERDICT.json
            WATCHDOG_VERDICT.md
            SITE_ENHANCEMENT_AUDIT.json
            SITE_ENHANCEMENT_AUDIT.md
            SEARCH_REACH_STATUS.json
            SEARCH_REACH_STATUS.md

      - name: Commit watchdog status with race-safe persistence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "health-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          files=(ZERO_VIEW_WATCHDOG.json ZERO_VIEW_WATCHDOG.md HEALTH_STATUS.json HEALTH_REPORT.md COMPREHENSIVE_SITE_AUDIT.json COMPREHENSIVE_SITE_AUDIT.md RENDERED_SITE_AUDIT.json WATCHDOG_VERDICT.json WATCHDOG_VERDICT.md SITE_ENHANCEMENT_AUDIT.json SITE_ENHANCEMENT_AUDIT.md SEARCH_REACH_STATUS.json SEARCH_REACH_STATUS.md)
          mkdir -p /tmp/daily-yield-health-state
          for file in "${files[@]}"; do
            [[ -f "$file" ]] && cp "$file" /tmp/daily-yield-health-state/
          done
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/daily-yield-health-state/* . 2>/dev/null || true
            git add "${files[@]}" 2>/dev/null || true
            if git diff --staged --quiet; then
              echo "No watchdog status changes to commit."
              exit 0
            fi
            git commit -m "Zero-view watchdog report [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent repository update detected; retrying watchdog persistence ($attempt/3)."
            sleep $((attempt * 2))
          done
          echo "Unable to persist watchdog status after three race-safe attempts."
          exit 1
