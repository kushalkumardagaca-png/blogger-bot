name: Blog Health Monitor (12x Daily Zero-View Watchdog)
# Workflow updates are applied through the repository-scoped deployment bridge.

on:
  schedule:
    # Twelve independent API/source checks daily. No public Daily Yield URL is opened.
    - cron: '15 */2 * * *'
  workflow_dispatch:

concurrency:
  group: zero-view-full-site-watchdog
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify publishing automation invariants
        run: python audit_publishing_automation.py --check-only

      - name: Enforce zero-synthetic-view policy
        run: python audit_zero_view_policy.py

      - name: Audit complete site through APIs without opening the blog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
        run: python zero_view_watchdog.py

      - name: Upload zero-view evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zero-view-watchdog-${{ github.run_id }}
          retention-days: 30
          path: |
            ZERO_VIEW_WATCHDOG.json
            ZERO_VIEW_WATCHDOG.md
            HEALTH_STATUS.json
            HEALTH_REPORT.md
            COMPREHENSIVE_SITE_AUDIT.json
            COMPREHENSIVE_SITE_AUDIT.md
            RENDERED_SITE_AUDIT.json
            WATCHDOG_VERDICT.json
            WATCHDOG_VERDICT.md

      - name: Commit watchdog status
        if: always()
        run: |
          git config user.name "health-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ZERO_VIEW_WATCHDOG.json ZERO_VIEW_WATCHDOG.md HEALTH_STATUS.json HEALTH_REPORT.md COMPREHENSIVE_SITE_AUDIT.json COMPREHENSIVE_SITE_AUDIT.md RENDERED_SITE_AUDIT.json WATCHDOG_VERDICT.json WATCHDOG_VERDICT.md || true
          if git diff --quiet && git diff --staged --quiet; then
            echo "No watchdog status changes to commit."
          else
            git commit -m "Zero-view watchdog report [skip ci]"
            git pull --rebase origin main
            git push
          fi
