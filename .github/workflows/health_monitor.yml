name: Blog Health Monitor (24/7 Watchdog)

on:
  schedule:
    # Runs 6x daily — shortly after each IST publishing slot + one overnight sweep
    # 03:45 UTC = 09:15 IST (after 08:00 slot)
    # 07:15 UTC = 12:45 IST (after 11:30 slot)
    # 10:15 UTC = 15:45 IST (after 14:30 slot)
    # 13:45 UTC = 19:15 IST (after 17:45 slot)
    # 16:15 UTC = 21:45 IST (after 20:30 slot)
    # 21:45 UTC = 03:15 IST (overnight full-day verification)
    - cron: '45 3,7,10,13,16,21 * * *'
  workflow_dispatch:

concurrency:
  group: health-monitor
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # commit HEALTH_STATUS.json / HEALTH_REPORT.md
      actions: write       # auto-heal: re-dispatch publisher if a slot was missed

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Health Monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python health_monitor/health_monitor.py

      - name: Commit Health Status
        if: always()
        run: |
          git config user.name "health-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HEALTH_STATUS.json HEALTH_REPORT.md
          if git diff --quiet && git diff --staged --quiet; then
            echo "No status changes to commit."
          else
            git commit -m "Health check: $(python3 -c 'import json; print(json.load(open("HEALTH_STATUS.json"))["overall"])') [skip ci]"
            git pull --rebase origin main
            git push
          fi
