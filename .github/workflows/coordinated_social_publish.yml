name: Coordinated Daily Yield Social Publisher

on:
  schedule:
    # Audience-local global windows: Asia morning, Europe working day, India
    # evening and US morning/afternoon. Daily rotation keeps three per app.
    - cron: '15 23 * * *'  # 04:45 IST
    - cron: '15 1 * * *'   # 06:45 IST
    - cron: '15 3 * * *'   # 08:45 IST
    - cron: '15 5 * * *'   # 10:45 IST
    - cron: '30 6 * * *'   # 12:00 IST
    - cron: '15 8 * * *'   # 13:45 IST
    - cron: '15 10 * * *'  # 15:45 IST
    - cron: '30 11 * * *'  # 17:00 IST
    - cron: '30 13 * * *'  # 19:00 IST
    - cron: '30 14 * * *'  # 20:00 IST
    - cron: '0 16 * * *'   # 21:30 IST
    - cron: '45 17 * * *'  # 23:15 IST
  workflow_dispatch:
    inputs:
      item_key:
        description: 'news-desk key from the authenticated Blogger publisher'
        required: false
        default: ''
        type: string
      target_url:
        description: 'Exact authenticated Blogger API destination'
        required: false
        default: ''
        type: string
      content_mode:
        description: 'post for event dispatch; scheduled runs plan a page'
        required: false
        default: post
        type: choice
        options: [post, page]
      published_at:
        description: 'Blogger publication timestamp used for the five-minute release'
        required: false
        default: ''
        type: string
      route_index:
        description: '0 to 2: which network of the assigned rotation to post to'
        required: false
        default: '0'
        type: choice
        options: ['0','1','2']
      extra_platforms:
        description: 'Optional comma-separated rotation for a supervised revival, e.g. facebook,tumblr,bluesky'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: coordinated-social-${{ inputs.item_key || github.event.schedule || github.run_id }}-${{ inputs.route_index || 'resource' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      platform: ${{ steps.route.outputs.platform }}
      target_url: ${{ steps.route.outputs.target_url }}
      content_mode: ${{ steps.route.outputs.content_mode }}
      delay_seconds: ${{ steps.route.outputs.delay_seconds }}
      item_key: ${{ steps.route.outputs.item_key }}
    steps:
      - uses: actions/checkout@v5
      - id: route
        shell: bash
        run: |
          python social_rotation.py \
            --item-key '${{ inputs.item_key }}' \
            --target-url '${{ inputs.target_url }}' \
            --content-mode '${{ inputs.content_mode || 'page' }}' \
            --published-at '${{ inputs.published_at }}' \
            --schedule '${{ github.event.schedule }}' \
            --route-index '${{ inputs.route_index || '0' }}' \
            --platforms '${{ inputs.extra_platforms }}'

  facebook:
    needs: plan
    if: needs.plan.outputs.platform == 'facebook'
    concurrency:
      group: social-facebook
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check requests pillow
      - name: Wait until five minutes after Blogger publication
        run: sleep '${{ needs.plan.outputs.delay_seconds }}'
      - name: Skip a repeat of the same article on Facebook
        id: dupe
        run: |
          set +e
          python social_dedupe.py --platform facebook --url '${{ needs.plan.outputs.target_url }}' --content-mode '${{ needs.plan.outputs.content_mode }}'
          code=$?
          if [ "$code" = "78" ]; then
            echo 'already=yes' >> "$GITHUB_OUTPUT"
          elif [ "$code" = "0" ]; then
            echo 'already=no' >> "$GITHUB_OUTPUT"
          else
            echo "Cannot verify dedupe history; defer this route safely."
            exit "$code"
          fi
      - name: Publish exact assigned destination to Facebook
        if: steps.dupe.outputs.already != 'yes'
        env:
          FACEBOOK_SYSTEM_USER_TOKEN: ${{ secrets.FACEBOOK_SYSTEM_USER_TOKEN }}
          FACEBOOK_PAGE_ID: '1303333369533572'
          FACEBOOK_GRAPH_VERSION: 'v26.0'
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: |
          set +e
          code=0
          # A 429 or a short API outage must not cost the day its post, and a failure that prints
          # nothing is a failure nobody can fix: three bounded attempts, then the network's own
          # words go into SOCIAL_CREDENTIAL_HEALTH.json, where social_guard.py stops sending work to
          # a broken network and the owner can read why a post is missing. The step still fails when
          # the post did not go out, so recovery keeps trying until it is actually delivered.
          for attempt in 1 2 3; do
            python facebook_publisher.py --content-mode '${{ needs.plan.outputs.content_mode }}' --target-url '${{ needs.plan.outputs.target_url }}' > /tmp/social_facebook.txt 2>&1
            code=$?
            cat /tmp/social_facebook.txt
            [ "$code" = "0" ] && break
            [ "$attempt" = "3" ] || sleep $((attempt * 45))
          done
          python social_credential_health.py --platform facebook --code "$code" --output /tmp/social_facebook.txt || true
          if [ "$code" != "0" ]; then
            reason="$(python social_credential_health.py --platform facebook --extract --output /tmp/social_facebook.txt)"
            echo "::error title=Facebook post not delivered::${reason:-the publisher printed no reason; its output is above}"
          fi
          exit "$code"
      - name: Persist Facebook tracker with race-safe retries
        # The state this step commits matters most when the step before it failed:
        # a refused token or a rejected post is the record the owner needs, and skipping
        # the persist step after a failure is how a broken connection stayed invisible
        # for two days. So persist unless the whole run was cancelled.
        if: ${{ !cancelled() }}
        run: |
          git config user.name 'Daily Yield Facebook Bot'
          git config user.email 'bot@dailyyield.blogspot.com'
          files=(facebook_tracker.json)
          # the health file is what turns a silent exit code into a readable reason
          [ -f SOCIAL_CREDENTIAL_HEALTH.json ] && files+=(SOCIAL_CREDENTIAL_HEALTH.json)
          bash persist_social_state.sh "${files[@]}"

  bluesky:
    needs: plan
    if: needs.plan.outputs.platform == 'bluesky'
    concurrency:
      group: social-bluesky
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check requests pillow
      - run: sleep '${{ needs.plan.outputs.delay_seconds }}'
      - name: Skip a repeat of the same article on Bluesky
        id: dupe
        run: |
          set +e
          python social_dedupe.py --platform bluesky --url '${{ needs.plan.outputs.target_url }}' --content-mode '${{ needs.plan.outputs.content_mode }}'
          code=$?
          if [ "$code" = "78" ]; then
            echo 'already=yes' >> "$GITHUB_OUTPUT"
          elif [ "$code" = "0" ]; then
            echo 'already=no' >> "$GITHUB_OUTPUT"
          else
            echo "Cannot verify dedupe history; defer this route safely."
            exit "$code"
          fi
      - name: Publish exact assigned destination to Bluesky
        if: steps.dupe.outputs.already != 'yes'
        env:
          BLUESKY_HANDLE: 'dailyyield.bsky.social'
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: |
          set +e
          code=0
          # A 429 or a short API outage must not cost the day its post, and a failure that prints
          # nothing is a failure nobody can fix: three bounded attempts, then the network's own
          # words go into SOCIAL_CREDENTIAL_HEALTH.json, where social_guard.py stops sending work to
          # a broken network and the owner can read why a post is missing. The step still fails when
          # the post did not go out, so recovery keeps trying until it is actually delivered.
          for attempt in 1 2 3; do
            python bluesky_publisher.py --content-mode '${{ needs.plan.outputs.content_mode }}' --target-url '${{ needs.plan.outputs.target_url }}' > /tmp/social_bluesky.txt 2>&1
            code=$?
            cat /tmp/social_bluesky.txt
            [ "$code" = "0" ] && break
            [ "$attempt" = "3" ] || sleep $((attempt * 45))
          done
          python social_credential_health.py --platform bluesky --code "$code" --output /tmp/social_bluesky.txt || true
          if [ "$code" != "0" ]; then
            reason="$(python social_credential_health.py --platform bluesky --extract --output /tmp/social_bluesky.txt)"
            echo "::error title=Bluesky post not delivered::${reason:-the publisher printed no reason; its output is above}"
          fi
          exit "$code"
      - name: Persist Bluesky tracker with race-safe retries
        # The state this step commits matters most when the step before it failed:
        # a refused token or a rejected post is the record the owner needs, and skipping
        # the persist step after a failure is how a broken connection stayed invisible
        # for two days. So persist unless the whole run was cancelled.
        if: ${{ !cancelled() }}
        run: |
          git config user.name 'Daily Yield Bluesky Bot'
          git config user.email 'bot@dailyyield.blogspot.com'
          files=(bluesky_tracker.json)
          # the health file is what turns a silent exit code into a readable reason
          [ -f SOCIAL_CREDENTIAL_HEALTH.json ] && files+=(SOCIAL_CREDENTIAL_HEALTH.json)
          bash persist_social_state.sh "${files[@]}"

  # One destination per network at a time. Tumblr's OAuth refresh token is rotated
  # by the job that publishes, so two simultaneous Tumblr jobs for two articles
  # both started from the same stored token: the first rotation invalidated the
  # second one's, and six routes failed on 19 October.
  tumblr:
    needs: plan
    if: needs.plan.outputs.platform == 'tumblr'
    concurrency:
      group: social-tumblr
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check requests cryptography pillow
      - run: sleep '${{ needs.plan.outputs.delay_seconds }}'
      - name: Skip a repeat of the same article on Tumblr
        id: dupe
        run: |
          set +e
          python social_dedupe.py --platform tumblr --url '${{ needs.plan.outputs.target_url }}' --content-mode '${{ needs.plan.outputs.content_mode }}'
          code=$?
          if [ "$code" = "78" ]; then
            echo 'already=yes' >> "$GITHUB_OUTPUT"
          elif [ "$code" = "0" ]; then
            echo 'already=no' >> "$GITHUB_OUTPUT"
          else
            echo "Cannot verify dedupe history; defer this route safely."
            exit "$code"
          fi
      - name: Publish exact assigned destination to Tumblr
        if: steps.dupe.outputs.already != 'yes'
        env:
          TUMBLR_BLOG_IDENTIFIER: 'dailyyield-official'
          TUMBLR_CONSUMER_KEY: ${{ vars.TUMBLR_CONSUMER_KEY }}
          TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
          TUMBLR_TOKEN_ENCRYPTION_KEY: ${{ secrets.TUMBLR_TOKEN_ENCRYPTION_KEY }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: |
          set +e
          code=0
          # A 429 or a short API outage must not cost the day its post, and a failure that prints
          # nothing is a failure nobody can fix: three bounded attempts, then the network's own
          # words go into SOCIAL_CREDENTIAL_HEALTH.json, where social_guard.py stops sending work to
          # a broken network and the owner can read why a post is missing. The step still fails when
          # the post did not go out, so recovery keeps trying until it is actually delivered.
          for attempt in 1 2 3; do
            python tumblr_publisher.py --content-mode '${{ needs.plan.outputs.content_mode }}' --target-url '${{ needs.plan.outputs.target_url }}' > /tmp/social_tumblr.txt 2>&1
            code=$?
            cat /tmp/social_tumblr.txt
            [ "$code" = "0" ] && break
            [ "$attempt" = "3" ] || sleep $((attempt * 45))
          done
          python social_credential_health.py --platform tumblr --code "$code" --output /tmp/social_tumblr.txt || true
          if [ "$code" != "0" ]; then
            reason="$(python social_credential_health.py --platform tumblr --extract --output /tmp/social_tumblr.txt)"
            echo "::error title=Tumblr post not delivered::${reason:-the publisher printed no reason; its output is above}"
          fi
          exit "$code"
      - name: Persist Tumblr token and tracker with race-safe retries
        # The state this step commits matters most when the step before it failed:
        # a refused token or a rejected post is the record the owner needs, and skipping
        # the persist step after a failure is how a broken connection stayed invisible
        # for two days. So persist unless the whole run was cancelled.
        if: ${{ !cancelled() }}
        run: |
          git config user.name 'Daily Yield Tumblr Bot'
          git config user.email 'bot@dailyyield.blogspot.com'
          files=(tumblr_token.enc tumblr_tracker.json)
          # the health file is what turns a silent exit code into a readable reason
          [ -f SOCIAL_CREDENTIAL_HEALTH.json ] && files+=(SOCIAL_CREDENTIAL_HEALTH.json)
          bash persist_social_state.sh "${files[@]}"

  mastodon:
    needs: plan
    if: needs.plan.outputs.platform == 'mastodon'
    concurrency:
      group: social-mastodon
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check requests cryptography pillow
      - run: sleep '${{ needs.plan.outputs.delay_seconds }}'
      - name: Skip a repeat of the same article on Mastodon
        id: dupe
        run: |
          set +e
          python social_dedupe.py --platform mastodon --url '${{ needs.plan.outputs.target_url }}' --content-mode '${{ needs.plan.outputs.content_mode }}'
          code=$?
          if [ "$code" = "78" ]; then
            echo 'already=yes' >> "$GITHUB_OUTPUT"
          elif [ "$code" = "0" ]; then
            echo 'already=no' >> "$GITHUB_OUTPUT"
          else
            echo "Cannot verify dedupe history; defer this route safely."
            exit "$code"
          fi
      - name: Publish exact assigned destination to Mastodon
        if: steps.dupe.outputs.already != 'yes'
        env:
          MASTODON_INSTANCE: https://mastodon.social
          MASTODON_TOKEN_KEY: ${{ secrets.MASTODON_TOKEN_KEY }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: |
          set +e
          code=0
          # A 429 or a short API outage must not cost the day its post, and a failure that prints
          # nothing is a failure nobody can fix: three bounded attempts, then the network's own
          # words go into SOCIAL_CREDENTIAL_HEALTH.json, where social_guard.py stops sending work to
          # a broken network and the owner can read why a post is missing. The step still fails when
          # the post did not go out, so recovery keeps trying until it is actually delivered.
          for attempt in 1 2 3; do
            python mastodon_publisher.py --content-mode '${{ needs.plan.outputs.content_mode }}' --target-url '${{ needs.plan.outputs.target_url }}' > /tmp/social_mastodon.txt 2>&1
            code=$?
            cat /tmp/social_mastodon.txt
            [ "$code" = "0" ] && break
            [ "$attempt" = "3" ] || sleep $((attempt * 45))
          done
          python social_credential_health.py --platform mastodon --code "$code" --output /tmp/social_mastodon.txt || true
          if [ "$code" != "0" ]; then
            reason="$(python social_credential_health.py --platform mastodon --extract --output /tmp/social_mastodon.txt)"
            echo "::error title=Mastodon post not delivered::${reason:-the publisher printed no reason; its output is above}"
          fi
          exit "$code"
      - name: Persist Mastodon tracker with race-safe retries
        # The state this step commits matters most when the step before it failed:
        # a refused token or a rejected post is the record the owner needs, and skipping
        # the persist step after a failure is how a broken connection stayed invisible
        # for two days. So persist unless the whole run was cancelled.
        if: ${{ !cancelled() }}
        run: |
          git config user.name 'Daily Yield Mastodon Bot'
          git config user.email 'bot@dailyyield.blogspot.com'
          files=(mastodon_tracker.json)
          # the health file is what turns a silent exit code into a readable reason
          [ -f SOCIAL_CREDENTIAL_HEALTH.json ] && files+=(SOCIAL_CREDENTIAL_HEALTH.json)
