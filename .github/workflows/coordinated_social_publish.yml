name: Coordinated Daily Yield Social Publisher

on:
  schedule:
    # Audience-local global windows: Asia morning, Europe working day, India
    # evening and US morning/afternoon. Daily rotation keeps three per app.
    - cron: '15 23 * * *'  # 04:45 IST
    - cron: '15 1 * * *'   # 06:45 IST
    - cron: '15 3 * * *'   # 08:45 IST
    - cron: '15 5 * * *'   # 10:45 IST
    - cron: '30 6 * * *'   # 12:00 IST
    - cron: '15 8 * * *'   # 13:45 IST
    - cron: '15 10 * * *'  # 15:45 IST
    - cron: '30 11 * * *'  # 17:00 IST
    - cron: '30 13 * * *'  # 19:00 IST
    - cron: '30 14 * * *'  # 20:00 IST
    - cron: '0 16 * * *'   # 21:30 IST
    - cron: '45 17 * * *'  # 23:15 IST
  workflow_dispatch:
    inputs:
      item_key:
        description: 'news-desk key from the authenticated Blogger publisher'
        required: false
        default: ''
        type: string
      target_url:
        description: 'Exact authenticated Blogger API destination'
        required: false
        default: ''
        type: string
      content_mode:
        description: 'post for event dispatch; scheduled runs plan a page'
        required: false
        default: post
        type: choice
        options: [post, page]
      published_at:
        description: 'Blogger publication timestamp used for the five-minute release'
        required: false
        default: ''
        type: string
      route_index:
        description: '0 to 2: which network of the assigned rotation to post to'
        required: false
        default: '0'
        type: choice
        options: ['0','1','2']
      extra_platforms:
        description: 'Optional comma-separated rotation for a supervised revival, e.g. facebook,tumblr,bluesky'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: coordinated-social-${{ inputs.item_key || github.event.schedule || github.run_id }}-${{ inputs.route_index || 'resource' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      platform: ${{ steps.route.outputs.platform }}
      target_url: ${{ steps.route.outputs.target_url }}
      content_mode: ${{ steps.route.outputs.content_mode }}
      delay_seconds: ${{ steps.route.outputs.delay_seconds }}
      item_key: ${{ steps.route.outputs.item_key }}
    steps:
      - uses: actions/checkout@v5
      - id: route
        shell: bash
        run: |
          python social_rotation.py \
            --item-key '${{ inputs.item_key }}' \
            --target-url '${{ inputs.target_url }}' \
            --content-mode '${{ inputs.content_mode || 'page' }}' \
            --published-at '${{ inputs.published_at }}' \
            --schedule '${{ github.event.schedule }}' \
            --route-index '${{ inputs.route_index || '0' }}' \
            --platforms '${{ inputs.extra_platforms }}'

  facebook:
    needs: plan
    if: needs.plan.outputs.platform == 'facebook'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check requests pillow
      - name: Wait until five minutes after Blogger publication
        run: sleep '${{ needs.plan.outputs.delay_seconds }}'
      - name: Skip a repeat of the same article on Facebook
        id: dupe
        run: |
          set +e
          python social_dedupe.py --platform facebook --url '${{ needs.plan.outputs.target_url }}'
          code=$?
          if [ "$code" = "78" ]; then echo 'already="yes"' >> "$GITHUB_OUTPUT"; else echo 'already="no"' >> "$GITHUB_OUTPUT"; fi
          exit 0
      - name: Publish exact assigned destination to Facebook
        if: steps.dupe.outputs.already != 'yes'
        env:
          FACEBOOK_SYSTEM_USER_TOKEN: ${{ secrets.FACEBOOK_SYSTEM_USER_TOKEN }}
          FACEBOOK_PAGE_ID: '1303333369533572'
          FACEBOOK_GRAPH_VERSION: 'v26.0'
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python facebook_publisher.py --content-mode '${{ needs.plan.outputs.content_mode }}' --target-url '${{ needs.plan.outputs.target_url }}'
      - name: Persist Facebook tracker with race-safe retries
        run: |
          git config user.name 'Daily Yield Facebook Bot'
          git config user.email 'bot@dailyyield.blogspot.com'
          bash persist_social_state.sh facebook_tracker.json

  bluesky:
    needs: plan
    if: needs.plan.outputs.platform == 'bluesky'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check requests pillow
      - run: sleep '${{ needs.plan.outputs.delay_seconds }}'
      - name: Skip a repeat of the same article on Bluesky
        id: dupe
        run: |
          set +e
          python social_dedupe.py --platform bluesky --url '${{ needs.plan.outputs.target_url }}'
          code=$?
          if [ "$code" = "78" ]; then echo 'already="yes"' >> "$GITHUB_OUTPUT"; else echo 'already="no"' >> "$GITHUB_OUTPUT"; fi
          exit 0
      - name: Publish exact assigned destination to Bluesky
        if: steps.dupe.outputs.already != 'yes'
        env:
          BLUESKY_HANDLE: 'dailyyield.bsky.social'
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python bluesky_publisher.py --content-mode '${{ needs.plan.outputs.content_mode }}' --target-url '${{ needs.plan.outputs.target_url }}'
      - name: Persist Bluesky tracker with race-safe retries
        run: |
          git config user.name 'Daily Yield Bluesky Bot'
          git config user.email 'bot@dailyyield.blogspot.com'
          bash persist_social_state.sh bluesky_tracker.json

  tumblr:
    needs: plan
    if: needs.plan.outputs.platform == 'tumblr'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check requests cryptography pillow
      - run: sleep '${{ needs.plan.outputs.delay_seconds }}'
      - name: Skip a repeat of the same article on Tumblr
        id: dupe
        run: |
          set +e
          python social_dedupe.py --platform tumblr --url '${{ needs.plan.outputs.target_url }}'
          code=$?
          if [ "$code" = "78" ]; then echo 'already="yes"' >> "$GITHUB_OUTPUT"; else echo 'already="no"' >> "$GITHUB_OUTPUT"; fi
          exit 0
      - name: Publish exact assigned destination to Tumblr
        if: steps.dupe.outputs.already != 'yes'
        env:
          TUMBLR_BLOG_IDENTIFIER: 'dailyyield-official'
          TUMBLR_CONSUMER_KEY: ${{ vars.TUMBLR_CONSUMER_KEY }}
          TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
          TUMBLR_TOKEN_ENCRYPTION_KEY: ${{ secrets.TUMBLR_TOKEN_ENCRYPTION_KEY }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python tumblr_publisher.py --content-mode '${{ needs.plan.outputs.content_mode }}' --target-url '${{ needs.plan.outputs.target_url }}'
      - name: Persist Tumblr token and tracker with race-safe retries
        run: |
          git config user.name 'Daily Yield Tumblr Bot'
          git config user.email 'bot@dailyyield.blogspot.com'
          bash persist_social_state.sh tumblr_token.enc tumblr_tracker.json

  mastodon:
    needs: plan
    if: needs.plan.outputs.platform == 'mastodon'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check requests cryptography pillow
      - run: sleep '${{ needs.plan.outputs.delay_seconds }}'
      - name: Skip a repeat of the same article on Mastodon
        id: dupe
        run: |
          set +e
          python social_dedupe.py --platform mastodon --url '${{ needs.plan.outputs.target_url }}'
          code=$?
          if [ "$code" = "78" ]; then echo 'already="yes"' >> "$GITHUB_OUTPUT"; else echo 'already="no"' >> "$GITHUB_OUTPUT"; fi
          exit 0
      - name: Publish exact assigned destination to Mastodon
        if: steps.dupe.outputs.already != 'yes'
        env:
          MASTODON_INSTANCE: https://mastodon.social
          MASTODON_TOKEN_KEY: ${{ secrets.MASTODON_TOKEN_KEY }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python mastodon_publisher.py --content-mode '${{ needs.plan.outputs.content_mode }}' --target-url '${{ needs.plan.outputs.target_url }}'
      - name: Persist Mastodon tracker with race-safe retries
        run: |
          git config user.name 'Daily Yield Mastodon Bot'
          git config user.email 'bot@dailyyield.blogspot.com'
          bash persist_social_state.sh mastodon_tracker.json
