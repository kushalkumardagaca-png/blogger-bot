name: Content Experience Inventory

on:
  push:
    branches: [main]
    paths:
      - 'content_experience_inventory.py'
      - '.github/workflows/content_experience_inventory.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-yield-content-experience-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Build authenticated zero-view inventory
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python content_experience_inventory.py
      - name: Persist inventory
        run: |
          git config user.name "Daily Yield Content Repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CONTENT_EXPERIENCE_INVENTORY.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Inventory content experience [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          exit 1
