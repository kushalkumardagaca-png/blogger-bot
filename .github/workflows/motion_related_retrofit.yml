name: Continuous carousels and related reading
on:
  push:
    branches: [main]
    paths:
      - 'continuous_motion.py'
      - 'motion_related_retrofit.py'
      - '.github/workflows/motion_related_retrofit.yml'
  workflow_dispatch:
    inputs:
      apply:
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
permissions:
  contents: read
jobs:
  retrofit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          APPLY: ${{ github.event_name == 'push' && 'true' || inputs.apply }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python motion_related_retrofit.py
      - uses: actions/upload-artifact@v4
        with:
          name: motion-related-${{ inputs.apply }}
          retention-days: 30
          path: |
            MOTION_RELATED_AUDIT.json
            motion_related_backup.json
