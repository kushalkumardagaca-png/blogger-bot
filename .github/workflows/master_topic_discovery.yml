name: Master Topic Discovery (Live)

on:
  schedule:
    - cron: '35 18 * * 6'  # Sunday 00:05 IST: weekly pool of 50
    - cron: '50 18 * * *'  # Daily 00:20 IST: five trending + five evergreen
  workflow_dispatch:
    inputs:
      mode:
        description: "weekly builds 50 trends; daily builds the 10-topic plan"
        required: true
        type: choice
        options: [weekly, daily]
        default: weekly

permissions:
  contents: write

concurrency:
  group: daily-yield-master-topic-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Select scheduled discovery mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "35 18 * * 6" ]; then
            echo "value=weekly" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "value=daily" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Discover topics from live demand signals
        env:
          MASTER_PUBLICATION_ENABLED: 'true'
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          GSC_SITE_PROPERTY: ${{ secrets.GSC_SITE_PROPERTY }}
        run: |
          for attempt in 1 2; do
            if python master_topic_discovery.py --${{ steps.mode.outputs.value }}; then exit 0; fi
            echo "Discovery attempt $attempt failed; retrying transient live sources."
            sleep $((attempt * 20))
          done
          exit 1
      - name: Persist discovery evidence and diagnostics
        if: always()
        run: |
          git config user.name "Daily Yield Master Discovery"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MASTER_TREND_POOL.json MASTER_DAILY_PLAN.json MASTER_DISCOVERY_STATUS.json 2>/dev/null || true
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Update dynamic Master topic intelligence [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
      - name: Preserve discovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-discovery-diagnostics-${{ github.run_id }}
          path: MASTER_DISCOVERY_STATUS.json
          if-no-files-found: warn
          retention-days: 30
