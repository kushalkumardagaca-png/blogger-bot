name: Quarantine Revival Publisher

# Brings the quarantined drafts back into public view one at a time, eight hours
# apart, and only after the full publication benchmark passes. Every run handles
# at most one article.

on:
  schedule:
    - cron: '0 */8 * * *'   # 05:30, 13:30 and 21:30 IST
  push:
    branches: [main]
    paths:
      - 'revive_quarantine.py'
      - 'test_quarantine_revival.py'
      - 'QUARANTINE_REVIVAL_PLAN.json'
      - 'social_rotation.py'
      - 'content_policy_guard.py'
      - 'publication_preflight.py'
      - '.github/workflows/quarantine_revival.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'survey = report the gap only; dry_run = build and validate the next package; apply = publish the next due article'
        required: false
        default: apply
        type: choice
        options: [apply, dry_run, survey]
      force:
        description: 'Ignore the eight-hour spacing for this run only'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-yield-quarantine-revival
  cancel-in-progress: false

jobs:
  revive:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow
      - name: Validate the revival rules
        run: python -m unittest test_quarantine_revival test_social_rotation -v
      - name: Survey, validate or publish the next quarantined article
        id: revive
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mode='${{ inputs.mode }}'
          if [ -z "$mode" ]; then
            if [ '${{ github.event_name }}' = 'push' ]; then mode=validate; else mode=apply; fi
          fi
          case "$mode" in
            survey)   python revive_quarantine.py --survey ;;
            validate) python revive_quarantine.py --survey; python revive_quarantine.py --dry-run --force ;;
            dry_run)  python revive_quarantine.py --dry-run ${{ inputs.force && '--force' || '' }} ;;
            *)        python revive_quarantine.py --apply ${{ inputs.force && '--force' || '' }} ;;
          esac
      - name: Keep the evidence in a retained artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quarantine-revival-${{ github.run_id }}
          retention-days: 90
          path: |
            QUARANTINE_REVIVAL_STATE.json
            BLOGGER_QUARANTINE_SURVEY.json
      - name: Persist the revival state race-safely
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.mode != 'survey') && steps.revive.outcome == 'success' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/dy-revival
          cp QUARANTINE_REVIVAL_STATE.json /tmp/dy-revival/
          git config user.name 'Daily Yield Revival Control'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main && git reset --hard FETCH_HEAD
            cp /tmp/dy-revival/* .
            git add QUARANTINE_REVIVAL_STATE.json
            if git diff --staged --quiet; then exit 0; fi
            git commit -m 'Update quarantine revival state [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
