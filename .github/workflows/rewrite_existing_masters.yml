name: Replace Legacy Master Articles with Master V2
# User-authorized gradual migration: one verified legacy Master per run.

on:
  push:
    branches: [main]
    paths:
      - 'rewrite_existing_masters.py'
      - 'prepare_master_article.py'
      - 'master_article_v2.py'
      - 'photo_selector.py'
      - 'build_photo_registry.py'
      - 'master_packages/rewrites/**'
      - 'assets/master/**'
      - 'ARENA_REWRITE_MANIFEST.json'
      - '.github/workflows/rewrite_existing_masters.yml'
      - 'refresh_master_photos.py'
  schedule:
    # Run only after all five new daily Masters have had their production windows.
    # Existing-post migration must never consume quota ahead of new publishing.
    - cron: '30 16 * * *'
  workflow_dispatch:

concurrency:
  # Share the production lock with new Masters; queued migration can never
  # overlap or interfere with a scheduled new-article publication.
  group: daily-yield-master-publisher
  cancel-in-progress: false

jobs:
  rewrite_one_backed_up_master:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[run master rewrite]')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    env:
      # Native Gemini is the proven free-tier writer; quota failures remain
      # fail-closed and are retried by the next scheduled migration window.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
      GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
      GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
      GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow imagehash requests

      - name: Build or confirm the authenticated global photo baseline
        run: python build_photo_registry.py

      - name: Persist the global photo baseline before any replacement
        run: |
          git config user.name "Daily Yield Photo Registry"
          git config user.email "bot@dailyyield.blogspot.com"
          git add PHOTO_USAGE_REGISTRY.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Build authenticated global photo-use baseline [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Capture the next original Post before any generation or update
        id: availability
        run: |
          python rewrite_existing_masters.py backup-next
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          print('has_pending='+str(bool(json.load(open('MASTER_REWRITE_STATE.json')).get('pending'))).lower())
          PY

      - name: Persist the original backup before preparing replacement content
        run: |
          set -euo pipefail
          git config user.name "Daily Yield Master Migration"
          git config user.email "bot@dailyyield.blogspot.com"
          git add MASTER_REWRITE_STATE.json MASTER_REWRITE_REPORT.json master_rewrite_backups
          git commit -m "Back up next legacy master before V2 rewrite [skip ci]"
          pushed=false
          for attempt in {1..12}; do
            git pull --rebase origin main
            if git push origin HEAD:main; then pushed=true; break; fi
            sleep $((attempt * 2))
          done
          $pushed

      - name: Research, generate and validate the replacement package
        if: steps.availability.outputs.has_pending == 'true'
        id: preparation
        continue-on-error: true
        run: python rewrite_existing_masters.py prepare-pending

      - name: Persist validated package and three photographs before Blogger update
        if: ${{ always() && steps.preparation.outcome == 'success' }}
        run: |
          set -euo pipefail
          git add MASTER_REWRITE_REPORT.json master_packages/rewrites assets/master PHOTO_USAGE_REGISTRY.json
          git commit -m "Prepare validated Master V2 rewrite package [skip ci]"
          pushed=false
          for attempt in {1..12}; do
            git pull --rebase origin main
            if git push origin HEAD:main; then pushed=true; break; fi
            sleep $((attempt * 2))
          done
          $pushed

      - name: Update the original Post ID and verify authenticated API reread
        if: ${{ always() && steps.preparation.outcome == 'success' }}
        id: application
        continue-on-error: true
        run: python rewrite_existing_masters.py apply-pending

      - name: Persist verified rewrite state or redacted failure
        if: always()
        run: |
          set -euo pipefail
          git config user.name "Daily Yield Master Migration"
          git config user.email "bot@dailyyield.blogspot.com"
          for path in MASTER_REWRITE_STATE.json MASTER_REWRITE_REPORT.json; do
            if [ -e "$path" ]; then git add "$path"; fi
          done
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Record legacy master V2 rewrite result [skip ci]"
          # A failed preparation may leave unvalidated photos/packages behind.
          # Preserve only the redacted report, then clean those unstaged files so
          # concurrent-state rebases cannot fail and no rejected asset is saved.
          git restore --worktree .
          git clean -fd assets/master master_packages/rewrites
          for attempt in {1..12}; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Enforce fail-closed migration result
        if: steps.preparation.outcome == 'failure' || steps.application.outcome == 'failure'
        run: exit 1

      - name: Upload migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-v2-rewrite-${{ github.run_id }}
          retention-days: 30
          path: |
            MASTER_REWRITE_STATE.json
            MASTER_REWRITE_REPORT.json
            master_packages/rewrites/*.json

  refresh_selected_master_photos:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[run master photo refresh]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: pip install Pillow
      - name: Back up, refresh and authenticated-reread all selected Posts
        id: refresh
        continue-on-error: true
        run: python refresh_master_photos.py
      - name: Upload photo refresh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-photo-refresh-trusted-${{ github.run_id }}
          retention-days: 30
          path: |
            MASTER_PHOTO_REFRESH_REPORT.json
            master_photo_refresh_backups/*.json.gz
      - name: Enforce fail-closed photo refresh result
        if: steps.refresh.outcome == 'failure'
        run: exit 1
