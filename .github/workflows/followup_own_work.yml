name: Complete Reviewed Archives and Image Records

on:
  push:
    branches: [main]
    paths: ['FOLLOWUP_OWN_WORK_REQUEST.json']
  workflow_dispatch:
    inputs:
      apply:
        description: Apply only the exact nine-archive/44-record request while it is valid
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: daily-yield-reviewed-followup
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Test the exact scope and safety invariants
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow imagehash json-repair pytest pyyaml cryptography
          python -m pytest -q
          python audit_publishing_automation.py
          git restore NEWS_COVERAGE_STATUS.json SEARCH_DEMAND_TRENDS.json PUBLISHING_AUTOMATION_AUDIT.json
      - name: Correct only the reviewed existing archives and image slots
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          APPLY_REVIEW: ${{ github.event_name == 'push' || inputs.apply }}
        run: |
          if [ "$APPLY_REVIEW" = 'true' ]; then
            python -u followup_own_work.py --apply
          else
            python -u followup_own_work.py
          fi
      - name: Refresh existing hub card data only (no rebuild)
        if: success() && (github.event_name == 'push' || inputs.apply)
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python content_experience_repair.py
      - name: Retain before-copies and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-followup-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            FOLLOWUP_OWN_WORK_STATUS.json
            FOLLOWUP_ARTICLE_REVIEW_PLAN.json
            FOLLOWUP_IMAGE_CORRECTION_PLAN.json
            TABLE3_CORPUS_AUDIT.json
            TABLE3_PHOTO_AUDIT.json
            /tmp/followup-before-corrections.json.gz
      - name: Persist the exact results without any account changes
        if: always()
        run: |
          git config user.name 'Daily Yield Arena Controller'
          git config user.email 'dailyyield.official@gmail.com'
          files=()
          for file in FOLLOWUP_OWN_WORK_STATUS.json TABLE3_CORPUS_AUDIT.json TABLE3_PHOTO_AUDIT.json CONTENT_EXPERIENCE_REPAIR_STATUS.json LABEL_FEED_INDEX.json; do
            if [ -f "$file" ]; then files+=("$file"); fi
          done
          bash persist_social_state.sh "${files[@]}"
