name: Refresh Published Master V2 Design

on:
  push:
    branches: [main]
    paths:
      - 'refresh_master_v2_design.py'
      - 'master_article_v2.py'
      - 'master_packages/rewrites/post_76036352328662163.json'
      - 'master_packages/topic_4.json'
      - '.github/workflows/refresh_master_v2_design.yml'
  workflow_dispatch:

concurrency:
  group: daily-yield-master-publisher
  cancel-in-progress: false

jobs:
  refresh_verified_v2_posts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests google-auth
      - name: Refresh and authenticated-reread published V2 posts
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python refresh_master_v2_design.py
      - name: Persist verified refresh report
        run: |
          git config user.name "Daily Yield Master Design"
          git config user.email "bot@dailyyield.blogspot.com"
          git add MASTER_V2_DESIGN_REFRESH_REPORT.json
          git commit -m "Verify published Master V2 design refresh [skip ci]"
          for attempt in {1..8}; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          exit 1
