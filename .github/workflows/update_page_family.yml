name: Update Daily Yield page family
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'update_page_family.py'
      - 'page_family.py'
      - 'brand_identity.py'
      - 'social_identity.py'
      - 'seo_hygiene.py'
      - 'policy_hero_scale.py'
      - 'test_page_family.py'
      - 'test_policy_hero_scale.py'
      - '.github/workflows/update_page_family.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: daily-yield-page-family-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Verify repeat-safe Page metadata controls
        run: python -m unittest test_page_family test_seo_hygiene test_policy_hero_scale -v
      - name: Back up and update every active static page
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python update_page_family.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-yield-page-family-update-${{ github.run_id }}
          path: |
            page_family_backup.json
            page_family_result.json
          retention-days: 30

      - name: Persist Page-family evidence safely
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Daily Yield Page Family Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/daily-yield-page-state
          for file in "${files[@]}"; do [[ -f "$file" ]] && cp "$file" /tmp/daily-yield-page-state/; done
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/daily-yield-page-state/* .
            git add "${files[@]}" 2>/dev/null || true
            if git diff --staged --quiet; then
              echo "No Page-family evidence change."
              exit 0
            fi
            git commit -m "Record Page-family evidence [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          echo "Could not persist Page-family evidence after three reconciled attempts." >&2
          exit 1
