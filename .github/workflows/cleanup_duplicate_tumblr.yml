name: Clean Proven Duplicate Tumblr Post

on:
  push:
    paths:
      - '.github/tumblr-duplicate-cleanup.json'

permissions:
  contents: write

concurrency:
  group: daily-yield-tumblr-duplicate-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests cryptography pillow
      - name: Delete only the tracker-proven duplicate
        env:
          TUMBLR_BLOG_IDENTIFIER: dailyyield-official
          TUMBLR_CONSUMER_KEY: ${{ vars.TUMBLR_CONSUMER_KEY }}
          TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
          TUMBLR_TOKEN_ENCRYPTION_KEY: ${{ secrets.TUMBLR_TOKEN_ENCRYPTION_KEY }}
        run: |
          POST_ID="$(python -c 'import json; print(json.load(open(".github/tumblr-duplicate-cleanup.json"))["post_id"])')"
          URL="$(python -c 'import json; print(json.load(open(".github/tumblr-duplicate-cleanup.json"))["url"])')"
          python cleanup_duplicate_tumblr.py --post-id "$POST_ID" --url "$URL"
      - name: Persist cleanup evidence
        run: |
          git config user.name 'Daily Yield Social Cleanup'
          git config user.email 'bot@dailyyield.blogspot.com'
          git add tumblr_tracker.json tumblr_token.enc
          git commit -m 'Remove proven duplicate Tumblr publication [skip ci]'
          git pull --rebase origin main
          git push origin main
