name: Master Slot Recovery
# 23 October: an empty or stale request must end this job as a notice. A recovery that has nothing
# to do is not an error, and an error nobody reads becomes a muted alarm.

# Recovers a Master article that today's schedule did not deliver.
# Put "evergreen:3" or "trending:3" (kind:slot) into
# .github/master-recovery-request and push. The article is written now and
# released as soon as its embargo allows, so no slot is ever abandoned.

on:
  push:
    branches: [main]
    paths:
      - '.github/master-recovery-request'
  schedule:
    # A push whose commit message carries a skip marker never reaches this workflow, and on 22 October
    # that silently swallowed two recovery requests for over an hour while two Master slots stayed empty.
    # The same request is therefore also read on a timer; master_recovery_request.py answers "dispatch"
    # only when the slot has no confirmed live article, no writer run is active, and the request is under
    # 90 minutes old, so the timer cannot start a second article for a slot that is already being written.
    - cron: '*/20 * * * *'

# Two pushes carrying a recovery request could each dispatch the same desk, and the desk
# then publishes twice. Queued, never cancelled: a recovery that is skipped is a missing
# edition, and a recovery that is delayed is still an edition.
permissions:
  actions: write
  contents: read

concurrency:
  group: master-slot-recovery
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decide whether the request still needs a writer
        id: want
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUNS_URL: ${{ github.api_url }}/repos/${{ github.repository }}/actions/runs
        run: |
          when="$(git log -1 --format=%ct -- .github/master-recovery-request 2>/dev/null || echo 0)"
          python master_recovery_request.py --runs-url "$RUNS_URL" --requested-at "$when"
      - name: Write and release the article
        if: steps.want.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run "${{ steps.want.outputs.file }}" --ref main \
            -f slot="${{ steps.want.outputs.slot }}" -f publish=true -f retry_attempt=0
          echo "Requested ${{ steps.want.outputs.kind }} slot ${{ steps.want.outputs.slot }}"
      - name: Nothing to do
        if: steps.want.outputs.dispatch != 'true'
        run: echo "::notice title=Recovery request already satisfied::${{ steps.want.outputs.note }}"
