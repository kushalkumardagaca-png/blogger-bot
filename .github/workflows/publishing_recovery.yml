name: Permanent Publication and Social Recovery

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'publishing_recovery.py'
      - 'test_publishing_recovery.py'
      - '.github/workflows/publishing_recovery.yml'

permissions:
  contents: write
  actions: write
concurrency:
  group: daily-yield-permanent-recovery
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Validate idempotent recovery rules
        run: python -m unittest test_publishing_recovery test_social_rotation -v
      - name: Recover overdue source slots and missing social routes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python publishing_recovery.py --apply
      # Failure evidence stays in retained artifacts; only a successful recovery
      # ledger is allowed to reach main.
      - name: Preserve recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: permanent-recovery-${{ github.run_id }}
          retention-days: 30
          path: |
            PUBLICATION_RECOVERY_STATUS.json
            RECOVERY_LEDGER.json
      - name: Persist ledger race-safely
        if: success()
        run: |
          set -euo pipefail
          mkdir -p /tmp/dy-recovery
          cp PUBLICATION_RECOVERY_STATUS.json RECOVERY_LEDGER.json /tmp/dy-recovery/
          git config user.name 'Daily Yield Recovery Control'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main && git reset --hard FETCH_HEAD
            cp /tmp/dy-recovery/* .
            git add PUBLICATION_RECOVERY_STATUS.json RECOVERY_LEDGER.json
            if git diff --staged --quiet; then exit 0; fi
            git commit -m 'Update permanent recovery evidence [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
