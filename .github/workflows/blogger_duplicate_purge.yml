name: Blogger Duplicate Pile

# Blogger published the same title twice often enough to leave "sold-property-eight-different-
# ways-to_0586614503.html" beside the original, and 360 such URLs are part of why Search Console
# says "discovered - currently not indexed".
#
# Owner rule, 20 October 2026: the daily 21 are maintained, so the answer to a duplicate is NOT
# to remove pages. The nightly run therefore *refreshes* each twin - its own headline plus a note
# built from the sentences only that edition carries - and keeps its URL, its images and its text.
# Bulk deletion is still available, but only as an explicit human choice in "Run workflow".

on:
  schedule:
    - cron: '10 20 * * *'   # 01:40 IST: differentiate the twins, delete nothing
  workflow_dispatch:
    inputs:
      action:
        description: "audit reports, refresh differentiates the twins, delete removes them (manual only)"
        required: true
        type: choice
        options: ['audit', 'refresh', 'delete']
        default: 'audit'
      max:
        description: "how many duplicate pairs this run may touch"
        required: false
        default: '25'

permissions:
  contents: write

concurrency:
  group: daily-yield-duplicate-pile
  cancel-in-progress: false

jobs:
  pile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Count the pile, refresh the twins, and delete only when a person chooses to
        run: |
          action="${{ github.event.inputs.action }}"
          if [[ -z "$action" ]]; then
            # the nightly default the owner chose on 20 October 2026: refresh, never delete
            action="$([ "${{ github.event_name }}" == "schedule" ] && echo refresh || echo audit)"
          fi
          cap="${{ github.event.inputs.max }}"
          [[ -n "$cap" ]] || cap="25"
          echo "mode: $action (up to $cap pairs)"
          case "$action" in
            delete)  python blogger_duplicate_purge.py --apply --max "$cap" ;;
            refresh) python duplicate_refresh.py --apply --max "$cap" ;;
            *)       python duplicate_refresh.py ;;
          esac
      - name: Report what the pile looks like
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib
          refresh_path = pathlib.Path("DUPLICATE_REFRESH.json")
          purge_path = pathlib.Path("BLOGGER_DUPLICATE_AUDIT.json")
          if refresh_path.exists():
              report = json.loads(refresh_path.read_text())
              print(f"refresh {report['mode']}: {report['titleGroups']} duplicate title groups, "
                    f"{report['twinsFound']} twins, {report['selectedThisRun']} selected "
                    f"(cap {report['batchCap']}), {len(report['refreshed'])} differentiated, "
                    f"{len(report['failed'])} failed, {report['deletions']} deleted")
              if report.get("stopped"):
                  print(f"::warning title=Refresh stopped before writing::{report['stopped']}")
          if purge_path.exists():
              audit = json.loads(purge_path.read_text())
              print(f"deletion audit {audit['mode']}: {audit['removable']} removable, "
                    f"{audit['protectedByEvidence']} protected, {len(audit['removed'])} removed")
              if audit["mode"] == "APPLIED" and audit["removable"]:
                  print("::notice title=Duplicates were deleted::they are archived in deleted_posts/ "
                        "and can be republished from there")
          if not refresh_path.exists() and not purge_path.exists():
              print("::warning title=No duplicate evidence::neither job produced a report")
          PY
      - name: Persist the evidence and the archives
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Daily Yield Arena Controller"
          git config user.email "dailyyield.official@gmail.com"
          mkdir -p /tmp/dy-pile
          for f in DUPLICATE_REFRESH.json DUPLICATE_REFRESH.md BLOGGER_DUPLICATE_AUDIT.json BLOGGER_DUPLICATE_AUDIT.md; do
            [ -f "$f" ] && cp "$f" /tmp/dy-pile/ || true
          done
          for d in duplicate_refresh_archive deleted_posts; do
            [ -d "$d" ] && cp -r "$d" /tmp/dy-pile/ || true
          done
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp -r /tmp/dy-pile/* . 2>/dev/null || true
            git add -A -- DUPLICATE_REFRESH.json DUPLICATE_REFRESH.md BLOGGER_DUPLICATE_AUDIT.json BLOGGER_DUPLICATE_AUDIT.md duplicate_refresh_archive deleted_posts 2>/dev/null || true
            if git diff --staged --quiet; then echo "nothing new to record"; exit 0; fi
            git commit -q -m "Record duplicate pile refresh [skip ci]" || true
            if git push -q origin HEAD:main; then echo "evidence recorded"; exit 0; fi
            sleep $((attempt * 4))
          done
          echo "::warning title=Evidence not pushed::main stayed busy; the numbers are in this log"
