name: Instagram OAuth Bootstrap

# One-time connection for the Instagram route. The owner creates a Meta app, authorises
# @daily_yield, stores the returned code as a repository secret, and runs this workflow.
# The long-lived token is then kept encrypted in the repository and refreshed
# automatically; the code itself is deleted by this workflow so it cannot be reused.
# Nothing is ever pasted into a chat.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "exchange stores a new token; verify only reads the profile back"
        required: true
        type: choice
        options: ['exchange', 'verify']
        default: 'verify'

permissions:
  contents: write

concurrency:
  group: daily-yield-instagram-oauth
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      INSTAGRAM_APP_ID: ${{ vars.INSTAGRAM_APP_ID }}
      INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
      INSTAGRAM_REDIRECT_URI: ${{ vars.INSTAGRAM_REDIRECT_URI }}
      INSTAGRAM_AUTHORIZATION_CODE: ${{ secrets.INSTAGRAM_AUTHORIZATION_CODE }}
      INSTAGRAM_TOKEN_ENCRYPTION_KEY: ${{ secrets.INSTAGRAM_TOKEN_ENCRYPTION_KEY }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_IG_USER_ID: ${{ secrets.INSTAGRAM_IG_USER_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --quiet requests cryptography
      - name: Exchange the one-time code, or verify the stored token
        run: |
          if [[ "${{ github.event.inputs.action }}" == "verify" ]]; then
            python instagram_oauth_bootstrap.py --verify
            exit 0
          fi
          python instagram_oauth_bootstrap.py
      - name: Store the encrypted token bundle and forget the code
        if: ${{ github.event.inputs.action == 'exchange' }}
        run: |
          git config user.name "Daily Yield Instagram OAuth"
          git config user.email "bot@dailyyield.blogspot.com"
          git add instagram_token.enc instagram_token_state.json
          git commit -q -m "Initialize encrypted Instagram authorization [skip ci]"
          git pull --rebase origin main && git push -q origin main
          # The one-time code is never reusable and must not sit in a secret.
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/secrets/INSTAGRAM_AUTHORIZATION_CODE" || \
            echo "could not delete the code secret; remove it by hand"
        env:
          GH_TOKEN: ${{ github.token }}
