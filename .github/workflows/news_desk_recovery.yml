name: News Desk Recovery

# Re-runs a single News desk on demand without leaving the repository tooling:
# write the desk slug into .github/news-recovery-request (for example "banking")
# and push. The desk is republished immediately with the release embargo lifted,
# which is exactly how an interrupted edition is repaired.

on:
  push:
    branches: [main]
    paths:
      - '.github/news-recovery-request'

# Two pushes carrying a recovery request could each dispatch the same desk, and the desk
# then publishes twice. Queued, never cancelled: a recovery that is skipped is a missing
# edition, and a recovery that is delayed is still an edition.
permissions:
  actions: write
  contents: read

concurrency:
  group: news-desk-recovery
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decide whether any requested edition is still missing
        id: want
        run: |
          # Two fixes in one step. An empty request file used to be reported as an error, which is a red
          # email for nothing having been asked; and a request pushed in the morning was re-honoured on
          # every later push that touched the file, dispatching a run for editions that had been live for
          # hours. The decision now comes from the day's own board: ask only for what is missing, and say
          # plainly when there is nothing left to ask for.
          python3 news_recovery_request.py
      - name: Re-run the desks that are still missing
        if: steps.want.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run daily_news_wires.yml --ref main -f desks="${{ steps.want.outputs.desks }}"
          echo "Requested immediate republication of: ${{ steps.want.outputs.desks }} (${{ steps.want.outputs.note }})"
      - name: Nothing to re-run
        if: steps.want.outputs.dispatch != 'true'
        run: echo "::notice title=No edition is missing::${{ steps.want.outputs.note }}"
